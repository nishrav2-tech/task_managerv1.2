/* ---- Funding schedule ----------------------------------------------------
   A property's funding schedule is an ordered list of dated tiers:
     [{id, name, date:'YYYY-MM-DD', percent:Number|null, amount:Number|null}, ...]

   percent is this tier's share of the profit split (70 = 70% in our favour).
   It's what the timeline displays, converted to dollars against the equity
   the deal creates. amount is the separate, optional record of cash actually
   wired — it never drives the timeline label.

   It round-trips to the properties.funding_schedule jsonb column, and each
   entry becomes a named checkpoint on that property's timeline.

   normalizeFunding() is the single gate every read and write passes through,
   so nothing downstream has to defend against nulls, a bare object, a JSON
   string from an older export, or entries missing a date.
--------------------------------------------------------------------------- */
const numOrNull = v => (v===''||v==null||isNaN(parseFloat(v))) ? null : parseFloat(v);

/* A funding tier is a band of days after closing, and how the profit splits
   during it. Only three things are ever entered:

     days     — the last day of the band, counted from the closing date
     pctUs    — operator's share while the deal sits in that band
     pctFunder— the funder's share

   Everything else is derived: the band's start day is the previous tier's
   end + 1, its calendar date is closing + days, and its label is "0-45 days".
   Deriving rather than storing means moving a closing date reshuffles the
   whole schedule automatically instead of leaving stale dates behind.

   normalizeFunding() is the one gate every read and write passes through, so
   nothing downstream defends against nulls, JSON strings from an old export,
   or tiers left over from the earlier dated-payment model. */
function normalizeFunding(raw, p){
  let list = raw;
  if(typeof list === 'string'){
    try{ list = JSON.parse(list); }catch(e){ return []; }
  }
  if(!Array.isArray(list)) return [];
  const closing = p && p.closingDate ? p.closingDate : null;

  const out = list
    .filter(f => f && typeof f === 'object')
    .map(f => {
      let days = numOrNull(f.days);
      // Migration: tiers from the earlier model carried a calendar date and a
      // single percent. Convert the date to a day offset where we can, and
      // read the old percent as our share with the remainder to the funder.
      if(days == null && f.date && closing){
        days = Math.round((dateMs(String(f.date).slice(0,10)) - dateMs(closing)) / 86400000);
      }
      let pctUs     = numOrNull(f.pctUs);
      let pctFunder = numOrNull(f.pctFunder);
      if(pctUs == null && pctFunder == null && f.percent != null){
        pctUs = numOrNull(f.percent);
        if(pctUs != null) pctFunder = 100 - pctUs;
      }
      return {id: f.id || uid(), days: days==null?null:Math.round(days), pctUs, pctFunder};
    })
    .filter(f => f.days != null && f.days > 0)   // a band has to end somewhere
    .sort((a,b) => a.days - b.days);

  // Two tiers ending on the same day would make a zero-length band; keep the
  // first and drop the duplicate rather than rendering an invisible marker.
  return out.filter((f,i) => i===0 || f.days !== out[i-1].days);
}

// Bands, with their start day and calendar date filled in. This is what every
// renderer works from — none of them recompute the offsets themselves.
function fundingBands(p){
  const tiers = normalizeFunding(p.funding, p);
  let from = 0;
  return tiers.map(t => {
    const band = {
      ...t,
      from,
      to: t.days,
      label: `${from}-${t.days} days`,
      date: p.closingDate ? addDays(p.closingDate, t.days) : null
    };
    from = t.days + 1;
    return band;
  });
}
const addDays = (iso, n) => {
  const d = new Date(dateMs(iso));
  d.setDate(d.getDate() + n);
  return isoLocal(d);
};
// How many days past closing the deal is today. Negative before closing,
// null with no closing date set.
function daysSinceClosing(p){
  if(!p.closingDate) return null;
  return Math.round((dateMs(today()) - dateMs(p.closingDate)) / 86400000);
}
// The band the deal is sitting in right now — the split that's live today.
function activeBand(p){
  const n = daysSinceClosing(p);
  if(n == null || n < 0) return null;
  return fundingBands(p).find(b => n >= b.from && n <= b.to) || null;
}
// A share of the profit, in dollars. Null with no sell price yet to create
// equity against — callers say so rather than showing a misleading $0.
function shareOf(p, pct){
  if(pct == null) return null;
  const equity = equityOf(p);
  if(equity === null) return null;
  return equity * (pct / 100);
}
// --- Funding tiers, as the Properties sort control thinks of them ---
// Final tier: the day the last band closes out.
const finalTier = p => { const b=fundingBands(p); return b.length ? b[b.length-1] : null; };
// Next tier step: the next band boundary still ahead of us.
const nextTier  = p => { const n=daysSinceClosing(p);
  return n==null ? null : (fundingBands(p).find(b => b.to >= n) || null); };

// Parse a stored YYYY-MM-DD as a *local* midnight, matching isoLocal().
// new Date('2026-08-05') alone is parsed as UTC and renders as Aug 4 in the
// Americas, which would put markers on the wrong day.
const dateMs = d => new Date(d+'T00:00:00').getTime();

// Equity created on a deal = sell price - buy price. Null until a sell price is entered.
function equityOf(p){
  if(p.sellPrice===''||p.sellPrice==null) return null;
  return (parseFloat(p.sellPrice)||0) - (parseFloat(p.buyPrice)||0);
}

/* ===== LOCAL NOTIFICATIONS =====
   Two triggers only:
     1. A task is assigned to whoever is signed in on this device.
     2. That task's deadline is tomorrow, or today.
   Works only while this app is open in a tab or installed and running —
   there's no server pushing to a fully closed browser here. Cross-device
   assignment (someone else assigns you a task on their device) is caught
   by the periodic background refresh, within its check interval.

   Mobile notes:
   - iOS Safari only exposes the Notification API inside an installed
     "Add to Home Screen" app (iOS 16.4+) — a regular Safari tab can't
     ask for permission at all. toggleNotifications() below detects this
     and tells the user to install it first instead of silently failing.
   - Notifications (and service workers generally) require a secure
     context (https:// or localhost). Loaded over plain http://, the
     APIs don't exist and nothing will work.
   - There's no push server here, so a fully closed browser/app will
     never wake up to notify — checks only run while the page is open.
     To make "reopening the app" catch up immediately instead of waiting
     for the next 5-minute interval, a visibilitychange listener (see
     app.init) re-checks the moment the tab/app comes back to the
     foreground. */
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent || '') && !window.MSStream;
}
function isStandalonePWA(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
    || window.navigator.standalone === true;
}
async function toggleNotifications(){
  if(!window.isSecureContext){
    toast('Notifications need a secure (https) connection to work','err');
    return;
  }
  if(!('Notification' in window)){
    if(isIOS() && !isStandalonePWA()){
      toast('On iPhone/iPad: tap Share → Add to Home Screen, then open the app from there','err');
    }else{
      toast('Notifications are not supported in this browser','err');
    }
    return;
  }
  if(Notification.permission === 'denied'){
    toast("Blocked — re-enable notifications for this site in your browser's settings",'err');
    return;
  }
  const currentlyOn = Notification.permission==='granted' && localStorage.getItem('notif_enabled')==='1';
  if(currentlyOn){
    localStorage.setItem('notif_enabled','0');
    toast('Reminders paused');
    return app.render();
  }
  if(Notification.permission !== 'granted'){
    const perm = await Notification.requestPermission();
    if(perm !== 'granted'){ toast('Notifications not enabled','err'); return app.render(); }
  }
  localStorage.setItem('notif_enabled','1');
  // Baseline: don't blast every existing assignment/completion the moment this is
  // switched on — only genuinely new ones from this point forward should notify.
  const uid = state.activeUserId;
  if(uid){
    const myTasks = state.tasks.filter(t=>(t.assignees||[]).includes(uid));
    localStorage.setItem('notif_assign_seen', JSON.stringify(myTasks.map(t=>t.id+':'+uid)));
    const myProjects = state.projects.filter(p=>(p.assignees||[]).includes(uid));
    localStorage.setItem('notif_project_assign_seen', JSON.stringify(myProjects.map(p=>p.id+':'+uid)));
  }
  localStorage.setItem('notif_task_done_seen', JSON.stringify(state.tasks.filter(t=>t.status==='done').map(t=>t.id)));
  toast('Reminders enabled');
  checkDueNotifications();
  app.render();
}

function notifyDevice(title, body, tag){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(reg=>{
    reg.showNotification(title, {
      body: body || '',
      tag: tag || undefined,
      icon: './icon-192.png',
      badge: './icon-192.png',
      data: { url: './index.html' }
    });
  }).catch(err=>console.log('Notification failed:', err));
}

function checkDueNotifications(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(localStorage.getItem('notif_enabled')!=='1') return;
  if(!('serviceWorker' in navigator)) return;
  const uid = state.activeUserId;
  if(!uid) return;

  const todayStr = today();
  const tmrw = new Date(); tmrw.setDate(tmrw.getDate()+1);
  const tomorrowStr = tmrw.toISOString().slice(0,10);

  const myTasks = state.tasks.filter(t=>(t.assignees||[]).includes(uid));
  const myOpenTasks = myTasks.filter(t=>t.status!=='done');

  // --- Deadline reminders: exactly the day before, and the day of. Once each per task. ---
  const dueKey = 'notif_due_shown_'+todayStr;
  let dueShown;
  try{ dueShown = JSON.parse(localStorage.getItem(dueKey)||'[]'); }catch(e){ dueShown = []; }
  let dueChanged = false;
  myOpenTasks.forEach(t=>{
    if(!t.dueDate || dueShown.includes(t.id)) return;
    if(t.dueDate === todayStr){
      notifyDevice('Task due today', t.title, 'task-due-'+t.id);
      dueShown.push(t.id); dueChanged = true;
    }else if(t.dueDate === tomorrowStr){
      notifyDevice('Task due tomorrow', t.title, 'task-duetomorrow-'+t.id);
      dueShown.push(t.id); dueChanged = true;
    }
  });
  if(dueChanged) localStorage.setItem(dueKey, JSON.stringify(dueShown));
  Object.keys(localStorage).forEach(k=>{
    if(k.startsWith('notif_due_shown_') && k!==dueKey) localStorage.removeItem(k);
  });

  // --- Assignment reminders (tasks): once per task per person, the first time we see it. ---
  let assignSeen = readSeenList('notif_assign_seen');
  let assignChanged = false;
  myTasks.forEach(t=>{
    const key = t.id+':'+uid;
    if(assignSeen.includes(key)) return;
    notifyDevice('Assigned to you', t.title, 'task-assigned-'+t.id);
    assignSeen.push(key); assignChanged = true;
  });
  if(assignChanged) localStorage.setItem('notif_assign_seen', JSON.stringify(assignSeen));

  // --- Assignment reminders (projects): same idea, separate tracking list. ---
  const myProjects = state.projects.filter(p=>(p.assignees||[]).includes(uid));
  let projAssignSeen = readSeenList('notif_project_assign_seen');
  let projAssignChanged = false;
  myProjects.forEach(p=>{
    const key = p.id+':'+uid;
    if(projAssignSeen.includes(key)) return;
    notifyDevice('New project assigned to you', p.title, 'project-assigned-'+p.id);
    projAssignSeen.push(key); projAssignChanged = true;
  });
  if(projAssignChanged) localStorage.setItem('notif_project_assign_seen', JSON.stringify(projAssignSeen));

  // --- Completion notices: ANY task marked done, by anyone. Once per task. The
  // device that actually completed it already marked it seen via markSeen(), so
  // it won't get a redundant notice about its own action. ---
  let doneSeen = readSeenList('notif_task_done_seen');
  let doneChanged = false;
  state.tasks.filter(t=>t.status==='done').forEach(t=>{
    if(doneSeen.includes(t.id)) return;
    notifyDevice('Task completed', t.title, 'task-done-'+t.id);
    doneSeen.push(t.id); doneChanged = true;
  });
  if(doneChanged) localStorage.setItem('notif_task_done_seen', JSON.stringify(doneSeen));
}

function readSeenList(key){
  try{ return JSON.parse(localStorage.getItem(key)||'[]'); }catch(e){ return []; }
}
function markSeen(key, value){
  const list = readSeenList(key);
  if(!list.includes(value)){ list.push(value); localStorage.setItem(key, JSON.stringify(list)); }
}

// Immediate notification path: fires the moment a save happens on THIS device,
// for whoever is signed in on THIS device, if they were just added as an assignee.
function notifyIfNewlyAssigned(kind, itemId, title, prevAssignees, newAssignees){
  const uid = state.activeUserId;
  if(!uid || !newAssignees.includes(uid) || prevAssignees.includes(uid)) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(localStorage.getItem('notif_enabled')!=='1') return;
  if(!('serviceWorker' in navigator)) return;
  const seenKey = kind==='project' ? 'notif_project_assign_seen' : 'notif_assign_seen';
  const seen = readSeenList(seenKey);
  const key = itemId+':'+uid;
  if(seen.includes(key)) return;
  notifyDevice(kind==='project' ? 'New project assigned to you' : 'Assigned to you', title, kind+'-assigned-'+itemId);
  seen.push(key);
  localStorage.setItem(seenKey, JSON.stringify(seen));
}

}

// Per-user task effectiveness: completed count, on-time %, avg days to complete, currently assigned.
// mf = {year, month} (month is 0-indexed) to scope completed-task stats to a single month; omit for all-time.
function inMonth(dateStr, mf){
  if(!dateStr) return false;
  const d = new Date(dateStr+'T00:00:00');
  return d.getFullYear()===mf.year && d.getMonth()===mf.month;
}
function userTaskStats(userId, mf){
  const assigned = state.tasks.filter(t=>(t.assignees||[]).includes(userId));
  const completedAll = assigned.filter(t=>t.status==='done');
  const completed = mf ? completedAll.filter(t=>inMonth(t.completedAt, mf)) : completedAll;
  const withCompletedAt = completed.filter(t=>t.completedAt);
  const withDueDate = withCompletedAt.filter(t=>t.dueDate);
  const onTime = withDueDate.filter(t=>t.completedAt <= t.dueDate);
  const onTimePct = withDueDate.length ? Math.round((onTime.length/withDueDate.length)*100) : null;
  const avgDays = withCompletedAt.length
    ? Math.round((withCompletedAt.reduce((sum,t)=>{
        const start = new Date(t.created||t.completedAt);
        const end = new Date(t.completedAt);
        return sum + Math.max(0, (end-start)/86400000);
      },0) / withCompletedAt.length) * 10) / 10
    : null;
  // "Currently assigned" is always a real-time snapshot, not scoped to the selected month.
  const current = assigned.filter(t=>t.status!=='done').length;
  return { completed: completed.length, onTimePct, avgDays, current };
}

/* Demo data is only ever written into a database that is provably, entirely
   empty — and only when every read succeeded.

   The old test was `if(!state.users.length) seed()`, which conflated a failed
   read with an empty table. On 2026-08-26 that fired against a live database
   holding 68 tasks and 19 projects, inserting three fake teammates, four
   sample tasks and four sample projects into production.

   Two independent conditions now have to hold. A failed read can't satisfy
   the first, and a database with any real content of its own can't satisfy
   the second — so no single fault can reach seed() again. A genuinely fresh
   install still gets its starter content, and Settings → Reset all data
   still calls seed() directly, which is the one place it should be
   unconditional because the user explicitly asked for it. */
async function maybeSeedEmptyDatabase(){
  if(state.coreFetchOk === false){
    console.warn('Skipping first-run seed: the last read errored, so "empty" cannot be trusted.');
    return;
  }
  const totallyEmpty = !state.users.length && !state.tasks.length
                    && !state.projects.length && !state.props.length;
  if(!totallyEmpty) return;
  await seed();
}
/* ---- Last-known KPI cache (2026-08-18) ---------------------------------
   Deferring kpi_entries made the first paint fast, but it also meant every
   KPI number rendered as an em-dash for ~400ms and then popped into place.
   Fast, but it reads as the screen glitching.

   So the rows are kept in localStorage and hydrated SYNCHRONOUSLY before the
   first render: the dashboard paints real numbers immediately, and the live
   fetch quietly replaces them a moment later. Because render() skips the DOM
   entirely when the generated HTML is unchanged, the usual case — nothing
   moved since last visit — produces no repaint at all. The number that was
   there when you closed the tab is the number that's there when you open it.

   Only the trailing 180 days are cached: that covers every built-in window
   (7/30/90) plus their previous-period comparisons, and keeps the blob near
   100KB rather than the full ~370KB. A custom range reaching further back
   simply fills in when the live rows land.

   The cache is a display accelerator, never a source of truth — it's
   replaced wholesale by the fetch, and any read/write failure (private mode,
   quota, corrupted JSON) is swallowed and just costs us the em-dashes. */
const KPI_CACHE_KEY = 'ulc_kpiCache_v1';
const KPI_CACHE_DAYS = 180;

function readKpiCache(){
  try{
    const raw = localStorage.getItem(KPI_CACHE_KEY);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed && parsed.rows) ? parsed.rows : null;
  }catch(e){ return null; }
}
function writeKpiCache(rows){
  try{
    const cutoff = isoLocal(new Date(Date.now() - KPI_CACHE_DAYS*86400000));
    const recent = rows.filter(r => r.date >= cutoff);
    localStorage.setItem(KPI_CACHE_KEY, JSON.stringify({savedAt: Date.now(), rows: recent}));
  }catch(e){ /* quota or private mode — the app works fine without it */ }
}
// Paints last-known numbers before the first render. Returns true if it had
// anything, so boot can tell "showing cached" from "genuinely has nothing".
function hydrateKpiCache(){
  const rows = readKpiCache();
  if(!rows || !rows.length) return false;
  state.kpiEntries = rows;
  return true;
}

// KPI history, after the first paint. Only touches state.kpiEntries, so it
// can't disturb anything the user is already interacting with.
async function loadKpiEntriesInto(){
  const rows = await StorageAdapter.loadKpiEntries();
  state.kpiEntries = migrateKpiEntryKeys(rows || []);
  state.kpiEntriesLoaded = true;
  writeKpiCache(state.kpiEntries);
}
function applyCore(data){
  state.coreFetchOk = data.fetchOk !== false;
  state.users = data.users;
  state.props = data.props;
  state.tasks = data.tasks;
  state.projects = data.projects;
  state.kpis = data.kpis || [];
  state.kpiMeta = data.kpiMeta || [];
  // undefined means "not fetched on this pass" — keep what we already have
  // rather than blanking the KPI screens during a core-only refresh.
  if(data.kpiEntries !== undefined){
    state.kpiEntries = migrateKpiEntryKeys(data.kpiEntries || []);
    state.kpiEntriesLoaded = true;
  }
  state.kpiTargets = migrateKpiTargetKeys(data.kpiTargets || {});
  state.callLogs = data.callLogs || [];
  state.campaignLogs = data.campaignLogs || [];
  state.activeUserId = data.activeUserId;
}
async function loadAll(){
  const data = await StorageAdapter.loadAll();
  applyCore(data);
  await maybeSeedEmptyDatabase();
}

  'no-config':   'config.js isn\'t supplying credentials',
  'no-lib':      'The Supabase library didn\'t load',
  'bad-url':     'The Supabase project URL looks wrong',
  'bad-key':     'Supabase rejected the API key',
  'unreachable': 'Can\'t reach the Supabase project',
  'schema':      'Connected, but the schema is incomplete'
};
const CONNECTION_FIXES = {
  'no-config':   ['Copy config.example.js to config.js.',
                  'Fill in the Project URL and the anon/public key from Supabase → Project Settings → API.'],
  'no-lib':      ['Check whether an ad blocker or network policy is blocking cdn.jsdelivr.net and unpkg.com.',
                  'If you\'re offline, reconnect and retry.'],
  'bad-url':     ['Confirm supabaseUrl in config.js looks like https://yourproject.supabase.co.'],
  'bad-key':     ['Re-copy the anon/public key from Supabase → Project Settings → API into config.js.',

function renderConnectionError(failure){
  const f = failure || {code:'unreachable', detail:'Unknown connection failure.'};
  const title = CONNECTION_TITLES[f.code] || 'Can\'t connect to Supabase';
  const fixes = CONNECTION_FIXES[f.code] || [];
  const cfg = window.CRM_CONFIG || {};
  // Only ever show the project ref, never the key itself.
  const projectRef = (cfg.supabaseUrl||'').replace(/^https?:\/\//,'').split('.')[0] || '—';

  document.body.innerHTML = `
  <div class="conn-wrap">
    <div class="conn-card">
      <div class="conn-icon"><i class="ti ti-plug-connected-x"></i></div>
      <h1 class="conn-title">${escape(title)}</h1>
      <p class="conn-detail">${escape(f.detail||'')}</p>
      <p class="conn-note">The app won't run on local data, because anything entered here wouldn't reach the rest of the team.</p>

      <div class="conn-facts">
        <div><span>config.js loaded</span><b>${window.__configError ? 'no' : 'yes'}</b></div>
        <div><span>Project</span><b>${escape(projectRef)}</b></div>
        <div><span>Library loaded</span><b>${window.supabase ? 'yes' : 'no'}</b></div>
      </div>

      ${f.tables && f.tables.length ? `
        <div class="conn-tables">
          <div class="conn-tables-head">Tables that failed (${f.tables.length} of ${StorageAdapter.requiredTables.length})</div>
          ${f.tables.map(t=>`<div class="conn-table-row"><code>${escape(t.name)}</code><span>${escape(t.message)}</span></div>`).join('')}
        </div>` : ''}

      ${f.raw ? `<div class="conn-raw">${escape(f.raw)}</div>` : ''}

      ${fixes.length ? `<ol class="conn-fixes">${fixes.map(s=>`<li>${escape(s)}</li>`).join('')}</ol>` : ''}

      <div class="conn-actions">
        <button class="btn btn-primary" onclick="retryConnection(this)"><i class="ti ti-refresh"></i> Retry connection</button>
        ${hasLegacyLocalData() ? `<button class="btn" onclick="downloadLegacyLocalData()"><i class="ti ti-download"></i> Download this device's old local data</button>` : ''}
      </div>
      ${hasLegacyLocalData() ? `<p class="conn-note" style="margin-top:10px">This browser still holds data from before the switch to Supabase-only. Download it before clearing anything.</p>` : ''}
    </div>
  </div>`;
}

async function retryConnection(btn){
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader-2"></i> Checking…'; }
  const conn = await StorageAdapter.init();
  if(conn.ok){ location.reload(); return; }
  renderConnectionError(conn.failure);
}

// Old builds mirrored everything locally. If any of that is still sitting in
// this browser, offer it as a download rather than stranding it.
function hasLegacyLocalData(){
  return StorageAdapter.legacyLocalKeys.some(k => {
    try{ const v = localStorage.getItem(k); return v && v !== '[]' && v !== '{}'; }
    catch(e){ return false; }
  });
}
function downloadLegacyLocalData(){
  const payload = {exportedAt:new Date().toISOString(), source:'localStorage (pre-Supabase-only build)'};
  StorageAdapter.legacyLocalKeys.forEach(k => {
    try{
      const v = localStorage.getItem(k);
      if(v) payload[k] = JSON.parse(v);
    }catch(e){ payload[k] = localStorage.getItem(k); }
  });
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `utopian-crm-local-snapshot-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

/* =========================================================
   APP CONTROLLER
   ========================================================= */
const app = {
  async init(){
    const conn = await StorageAdapter.init();
    // Supabase is the only backend now. Rather than quietly running on local
    // data nobody else can see, stop here and say exactly what's wrong.
    if(!conn.ok){
      renderConnectionError(conn.failure);
      return;
    }
    // Old builds mirrored everything into localStorage. Now that we're
    // connected, clear that copy so it can't be mistaken for live data.
    StorageAdapter.legacyLocalKeys.forEach(k => { try{ localStorage.removeItem(k); }catch(e){} });

    // PARALLELISED 2026-08-18. These were three serial awaits: every table,
    // then prefs, then paint. Prefs is keyed by the active user id, which
    // comes from localStorage rather than from the fetch, so it never needed
    // to wait for it — the dependency was accidental. Core data and prefs now
    // go out together, and KPI history is deliberately NOT awaited here.
    // Last-known KPI numbers, straight from localStorage — no network, so the
    // first paint shows real figures instead of em-dashes. Overwritten by the
    // live fetch below; see hydrateKpiCache().
    hydrateKpiCache();

    await Promise.all([
      loadCore(),
      Prefs.load(localStorage.getItem(StorageAdapter.localKeys.active) || '')
    ]);
    // Restore the tab you were last on before the first render, so a reload
    // lands you back where you were instead of bouncing to the dashboard.
    state.activeView = startingView();
    if(location.hash.slice(1) !== state.activeView){
      history.replaceState(null, '', '#' + state.activeView);
    }
    this.bindNav();
    this.buildUserSelect();
    this.render();          // <- first paint happens here, without KPI history
    updateBackendBadge();

    // KPI history streams in behind the first paint and repaints when it
    // lands. Anything that reads state.kpiEntries renders empty until then,
    // which is why kpiEntriesLoaded exists — screens can say "loading"
    // rather than "no data", a distinction that matters when the honest
    // answer to "why is this zero" is "it hasn't arrived yet".
    loadKpiEntriesInto()
      .then(() => this.requestRender())
      .catch(e => console.warn('KPI history failed to load:', e.message||e));

    checkDueNotifications();
    const refreshAndCheck = async ()=>{
      // Pull fresh data first so a task assigned to you from someone else's
      // device shows up here too, not just ones saved on this browser.
      if(StorageAdapter.backend==='supabase'){
        try{
          await loadAll();
          // Repaint so a teammate's change shows up — but through the same
          // identical-HTML guard, so a refresh that changed nothing (the
          // common case) leaves the DOM completely untouched.
          app.requestRender();
        }catch(e){ console.log('Background refresh failed:', e); }
      }
      checkDueNotifications();
    };
    setInterval(refreshAndCheck, 5*60*1000);
    // Mobile browsers pause timers for backgrounded tabs, so the interval
    // above can't be relied on to fire while the phone is locked or the
    // app is switched away from. Catch up the instant the user comes back
    // instead of waiting for the next scheduled tick.
    document.addEventListener('visibilitychange', ()=>{
      if(document.visibilityState === 'visible') refreshAndCheck();
    });
    window.addEventListener('focus', refreshAndCheck);
  },

  bindNav(){
    document.querySelectorAll('.nav-item[data-view]').forEach(el=>{
      el.addEventListener('click', ()=>{
        this.go(el.dataset.view);
      });
    });
    // Back/forward between tabs, and pasting a #view link, both land here.
    window.addEventListener('hashchange', ()=>{
      const raw = viewFromHash();
      const v = raw ? normalizeView(raw) : null;
      if(v && v !== state.activeView){
        state.activeView = v;
        state.filters = {};
        rememberView(v);
        this.render();
      }
    });
  },

  // Single entry point for changing tab, so the stored view and the URL can
  // never drift out of sync with what's actually on screen.
  go(view){
    if(!VALID_VIEWS.includes(view)) view = 'dashboard';
    view = normalizeView(view);
    state.activeView = view;
    state.filters = {};
    rememberView(view);
    if(location.hash.slice(1) !== view){
      // replaceState rather than assigning location.hash: switching tabs
      // shouldn't pile up history entries you have to click back through.
      history.replaceState(null, '', '#' + view);
    }
    this.render();
  },

  buildUserSelect(){
    const sel = $('#active-user-select');
    sel.innerHTML = `<option value="">Choose user…</option>` +
      state.users.map(u => `<option value="${u.id}" ${u.id===state.activeUserId?'selected':''}>${escape(u.name)}</option>`).join('');
  },

  async switchUser(id){
    // Push the outgoing user's pending preference changes before swapping,
    // or a quick switch would drop whatever they just changed.
    await Prefs.flush();
    state.activeUserId = id;
    StorageAdapter.saveActiveUser(id);
    await Prefs.load(id);
    // Anything derived from prefs has to be re-read for the new user rather
    // than carrying the previous person's tab and calendar position over.
    state.tpTab = undefined;
    state.ktTab = undefined;
    state.calendarUserId = undefined;
    state.agendaUserId = undefined;
    state.weekCalendarOffset = undefined;
    state.activityCalendarOffset = undefined;
    state.kpiAsOf = undefined;
    state.kpiChart = undefined;
    this.render();
    checkDueNotifications();
  },

  render(){
    // Nav counts. Tasks & Projects is one tab now, so its badge is the sum of
    // both open lists. Guarded because the Projects badge no longer exists.
    const openTaskCount = state.tasks.filter(t=>t.status!=='done').length;
    const openProjCount = state.projects.filter(p=>p.status!=='done').length;
    const setCount = (sel, n) => { const el = $(sel); if(el) el.textContent = n; };
    setCount('#count-props', state.props.length);
    setCount('#count-tasks', openTaskCount + openProjCount);
    setCount('#count-projs', openProjCount);

    document.querySelectorAll('.nav-item[data-view]').forEach(el=>{
      el.classList.toggle('active', el.dataset.view === state.activeView);
    });

    // Backend badge + "who's using this device" selector only need to live in the
    // top bar on the Dashboard — it's already got its own prominent selector there,
    // so keeping it in the global bar everywhere else was just clutter/duplication.
    const topRight = document.querySelector('.topbar-right');
    if(topRight) topRight.style.display = state.activeView === 'dashboard' ? 'flex' : 'none';

    this.buildUserSelect();

    const main = $('#main');

    const renderers = {
      dashboard: renderDashboard,
      properties: renderProperties,
      tasks: renderTasksProjects,
      projects: renderTasksProjects,
      activity: renderKpiTracking,
      kpis: renderKpiTracking,
      team: renderTeam,
      settings: renderSettings,
    };
    /* ---- Repaint discipline (2026-08-18) --------------------------------
       This used to blow away #main and restart the .view-enter/fadeUp
       animation on EVERY call, and render() is called from ~50 places. On a
       cold load of the KPI tab that meant up to six full rebuilds inside the
       first second — first paint, KPI history arriving, then four cohort RPCs
       resolving one after another — each one flashing the whole screen and
       throwing away scroll position. Three rules now:

         1. Animate only on a genuine VIEW CHANGE. Data arriving under the
            view you're already looking at repaints silently.
         2. If the generated HTML is byte-identical to what's on screen,
            don't touch the DOM at all. Most redundant renders are no-ops,
            and this makes them free and invisible — once a number is on
            screen it stays there rather than being torn down and rebuilt
            with the same value.
         3. Preserve scroll across an in-place repaint. Replacing innerHTML
            resets it, which is what made late-arriving data yank the page
            back to the top mid-read.                                      */
    const html = (renderers[state.activeView] || renderDashboard)();
    const viewChanged = this._lastView !== state.activeView;

    if(!viewChanged && html === this._lastHtml) return;   // nothing to do

    const scrollY = window.scrollY;
    const mainScroll = main.scrollTop;

    if(viewChanged){
      main.className = 'main view-enter';
      void main.offsetWidth;          // restart the entrance animation
      main.className = 'main view-enter';
    }else{
      main.className = 'main';        // no animation for a data repaint
    }

    // Same screen, changed numbers: try to write the difference into the
    // existing DOM rather than rebuilding it. Only a real view change (or a
    // structural change the patcher refuses) rebuilds.
    let patched = false;
    this._patchCreatedNodes = false;
    if(!viewChanged){
      const staging = document.createElement('div');
      staging.innerHTML = html;
      patched = true;
      const oldKids = Array.from(main.childNodes);
      const newKids = Array.from(staging.childNodes);
      const shared  = Math.min(oldKids.length, newKids.length);
      for(let i = 0; i < shared; i++){
        if(!this._patchDom(oldKids[i], newKids[i])){
          main.replaceChild(newKids[i].cloneNode(true), oldKids[i]);
          this._patchCreatedNodes = true;
        }
      }
      for(let i = shared; i < oldKids.length; i++) main.removeChild(oldKids[i]);
      for(let i = shared; i < newKids.length; i++){
        main.appendChild(newKids[i].cloneNode(true));
        this._patchCreatedNodes = true;
      }
    }

    if(!patched){
      main.innerHTML = html;
    }

    this._lastView = state.activeView;
    this._lastHtml = html;

    if(!viewChanged && !patched){
      // Had to rebuild after all — at least keep the reader where they were.
      if(mainScroll) main.scrollTop = mainScroll;
      if(scrollY) window.scrollTo(0, scrollY);
    }

    // Patching reuses nodes bindViewEvents already bound, so re-binding is
    // only needed when the patch actually created new elements. bindViewEvents
    // is idempotent either way (it marks what it binds), so this is belt and
    // braces rather than the only thing standing between us and duplicate
    // listeners firing an action twice.
    if(patched && !this._patchCreatedNodes) return;

    bindViewEvents();
    // The inline funding editor builds its rows as real DOM nodes, so it has
    // to be filled in after the view's HTML is in place.
    hydrateFundingPanel();
  },

  /* ---- In-place patching (2026-08-18) ---------------------------------
     Killing the .view-enter animation wasn't enough: the CARDS carry their
     own fadeUp entrance animations (.card, .kpi-tile, .snap-tile and others).
     Any innerHTML assignment builds brand-new elements, so every one of those
     animations restarts — the whole screen visibly animates in again, which
     is what still read as glitching when data landed.

     So a data repaint no longer replaces anything. patchDom walks the old and
     new trees together and writes only what actually differs: changed text,
     changed attributes. Untouched elements are literally the same DOM nodes
     they were a moment ago, so their animations never re-fire, focus and text
     selection survive, and a number that's already on screen simply stays.

     It is deliberately conservative — any structural difference (different
     tag, different number of children) aborts and hands back false, and the
     caller falls back to a full replace. Structure only changes on a real
     view change or when a list gains/loses a row, which is exactly when a
     rebuild is legitimate. Numbers changing never alters structure.

     Returns true if the patch fully succeeded. On true the caller must NOT
     re-run bindViewEvents(): the nodes are the same ones it already bound,
     and binding again would stack duplicate listeners. */
  _patchDom(oldNode, newNode){
    if(oldNode.nodeType !== newNode.nodeType) return false;

    if(oldNode.nodeType === Node.TEXT_NODE || oldNode.nodeType === Node.COMMENT_NODE){
      if(oldNode.nodeValue !== newNode.nodeValue) oldNode.nodeValue = newNode.nodeValue;
      return true;
    }
    if(oldNode.nodeType !== Node.ELEMENT_NODE) return true;
    if(oldNode.tagName !== newNode.tagName) return false;


    // Attributes. Skip anything the user is currently interacting with, so a
    // background repaint can't wipe half-typed input or reset a scroll box.
    const isLive = document.activeElement === oldNode;
    if(!isLive){
      for(const at of Array.from(newNode.attributes)){
        if(oldNode.getAttribute(at.name) !== at.value) oldNode.setAttribute(at.name, at.value);
      }
      for(const at of Array.from(oldNode.attributes)){
        if(!newNode.hasAttribute(at.name)) oldNode.removeAttribute(at.name);
      }
    }

    /* Children are reconciled position by position rather than requiring the
       counts to match. An earlier version bailed out whenever they differed,
       which sounded safe but meant the dashboard rebuilt wholesale every time
       a trend arrow appeared — one extra <i> in a tile was enough to restart
       every card animation on the screen. Now a mismatch replaces only the
       node that actually differs, and its siblings are left untouched. */
    const oldKids = Array.from(oldNode.childNodes);
    const newKids = Array.from(newNode.childNodes);
    const shared  = Math.min(oldKids.length, newKids.length);

    for(let i = 0; i < shared; i++){
      if(!this._patchDom(oldKids[i], newKids[i])){
        oldNode.replaceChild(newKids[i].cloneNode(true), oldKids[i]);
        this._patchCreatedNodes = true;
      }
    }
    for(let i = shared; i < oldKids.length; i++){
      oldNode.removeChild(oldKids[i]);
    }
    for(let i = shared; i < newKids.length; i++){
      oldNode.appendChild(newKids[i].cloneNode(true));
      this._patchCreatedNodes = true;
    }
    return true;
  },

  /* Coalesce bursts of render requests into one repaint. The four cohort
     RPCs resolve within milliseconds of each other; without this each one
     rebuilds the view separately. Anything that repaints in response to data
     ARRIVING should call this rather than render() directly. */
  requestRender(){
    if(this._rafPending) return;
    this._rafPending = true;
    requestAnimationFrame(() => { this._rafPending = false; this.render(); });
  },
};

/* =========================================================
   ACQUISITIONS PERFORMANCE — KPIs and expectations
   ---------------------------------------------------------
   Two layers:

   1. INPUTS (KPI_METRICS) — the raw counts you actually log,
      one number per input per day. Totals like "hours spent
      preparing offers" are logged as totals for that day, not
      as an average.

   2. KPI_DEFS — what the dashboard displays. Each one is
      derived from inputs over a trailing window:
        sum   → just adds an input up
        ratio → num ÷ den, optionally ×100 for a percentage
        avg   → a total ÷ a count (e.g. hours ÷ offers)

   Deriving rather than logging averages directly is what keeps
   the window math honest: a 7-day average sums the parts across
   all 7 days and divides once, so a slow day with one lead
   doesn't outweigh a fast day with twelve.
   ========================================================= */

/* ---- KPI sections -------------------------------------------------------
   The four stages a deal moves through. Sections are fixed; which metrics
   sit in each is a per-device choice stored in localStorage, so the pipeline
   can be arranged from the UI without touching this file. Every section
   starts empty — metrics live under "Unassigned" until they're placed.     */
const KPI_SECTIONS = [
  {key:'leadGen',    label:'Lead Generation', icon:'ti-seeding'},
  {key:'leadConv',   label:'Lead Conversion', icon:'ti-arrows-right'},
  {key:'dueDil',     label:'Due Diligence',   icon:'ti-file-search'},

/* ---- Which sections are live right now ---------------------------------
   Due Diligence and Disposition are fully defined above but switched off
   while the team focuses on the top of the funnel. Nothing is deleted: add
   'dueDil' and 'disposition' back to this array and their KPIs, inputs,
   tiles, grid rows and calendar options all reappear, with any data logged
   in the meantime still intact.                                           */
const KPI_ACTIVE_SECTIONS = ['leadGen','leadConv'];
const isKpiSectionActive = key => KPI_ACTIVE_SECTIONS.includes(key);

// Everything the UI iterates over reads these, not the raw constants.
const activeKpiSections = () => KPI_SECTIONS.filter(s => isKpiSectionActive(s.key));
const activeKpiDefs     = () => KPI_DEFS.filter(d => isKpiSectionActive(d.section));
const activeKpiInputs   = () => KPI_METRICS.filter(m => isKpiSectionActive(m.group));

const kpiDefsInSection = sectionKey => KPI_DEFS.filter(d => d.section === sectionKey);
const kpiInputsInSection = sectionKey => KPI_METRICS.filter(m => m.group === sectionKey);

/* ---- Expectations (targets) ---------------------------------------------
   Every KPI can carry a goal. Blank means "no expectation set yet" — nothing
   is invented, and a KPI without a goal simply shows its value. `dir` on the
   definition decides which side of the goal counts as on track.
   'smsMonthlyGoal' is a special entry: a monthly SMS number that the 7-day
   KPI is paced against rather than compared to directly.                   */
// Two KPIs were re-windowed from 1 day to 7 and 30; any goal set against the
// old key is carried over so the expectation isn't silently lost.
const KPI_TARGET_RENAMES = {firstContact1:'firstContact7', buyerResp1:'buyerResp30'};
// Goals live in Supabase (kpi_targets) and are shared by the whole team, so
// they're hydrated once at boot by loadAll() rather than read lazily here.
// This only folds forward goals stored under a since-renamed KPI key.
function migrateKpiTargetKeys(t){
  const out = {...(t || {})};

  _kpiCalDown = e => {
    const path = typeof e.composedPath === 'function' ? e.composedPath() : [];
    const inside = path.some(n => n && n.classList && n.classList.contains('kpi-range-picker'))
      || (e.target && e.target.closest && !!e.target.closest('.kpi-range-picker'));
    if(!inside) closeKpiRangeCalendar();
  };
  _kpiCalReflow = () => positionKpiCalPopover();
  // Deferred so the interaction that opened the calendar doesn't close it.
  setTimeout(() => { if(getKpiCal().open) document.addEventListener('mousedown', _kpiCalDown, true); }, 0);
  window.addEventListener('scroll', _kpiCalReflow, true);
  window.addEventListener('resize', _kpiCalReflow);
}
function unbindKpiCalDismiss(){
  if(_kpiCalDown) document.removeEventListener('mousedown', _kpiCalDown, true);
  if(_kpiCalReflow){
    window.removeEventListener('scroll', _kpiCalReflow, true);
    window.removeEventListener('resize', _kpiCalReflow);
  }
  _kpiCalDown = _kpiCalReflow = null;
}

function toggleKpiRangeCalendar(){
  const c = getKpiCal();
  c.open = !c.open;
  if(c.open){
    c.pendingFrom = null;
    // Open on the month the range starts in, not always the current month.
    const from = getKpiTrackerCustomRange().from;
    c.monthOffset = from ? monthDiff(new Date(), asLocalDate(from)) : 0;
    refreshKpiCalPicker();
    bindKpiCalDismiss();
  }else{
    unbindKpiCalDismiss();
    refreshKpiCalPicker();
  }
}
function closeKpiRangeCalendar(){
  const c = getKpiCal();
  if(!c.open) return;
  c.open = false; c.pendingFrom = null;
  unbindKpiCalDismiss();
  refreshKpiCalPicker();
}
function shiftKpiCalMonth(delta){
  const c = getKpiCal();
  // Never page past the current month — there's no data in the future.
  if(delta > 0 && c.monthOffset >= 0) return;
  c.monthOffset += delta;
  refreshKpiCalPicker();
}
function pickKpiRangeDay(dateStr){
  const c = getKpiCal();
  if(!c.pendingFrom){
    // First click: provisional start. The second click completes it either
    // way, so clicking an earlier day than the first still works.
    c.pendingFrom = dateStr;
    refreshKpiCalPicker();
    return;
  }
  const a = c.pendingFrom, b = dateStr;
  const from = a <= b ? a : b, to = a <= b ? b : a;
  c.pendingFrom = null;
  c.open = false;
  unbindKpiCalDismiss();
  setKpiTrackerCustomRange(from, to);   // full render: the tiles change
}

function renderKpiRangeCalendar(range){
  const c = getKpiCal();
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + c.monthOffset);
  const year = base.getFullYear(), month = base.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayStr = today();
  const monthLabel = base.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const atCurrentMonth = c.monthOffset >= 0;

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="kpi-cal-day blank"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const future = ds > todayStr;
    const cls = [];
    if(future) cls.push('disabled');
    if(ds === todayStr) cls.push('today');
    if(c.pendingFrom){
      if(ds === c.pendingFrom) cls.push('start','end');
    }else{
      if(ds >= range.from && ds <= range.to) cls.push('in-range');
      if(ds === range.from) cls.push('start');
      if(ds === range.to) cls.push('end');
    }
    cells += `<div class="kpi-cal-day ${cls.join(' ')}"
      ${future?'':`onclick="pickKpiRangeDay('${ds}')"`}>${d}</div>`;
  }

  return `<div class="kpi-cal-pop">
    <div class="kpi-cal-head">
      <button class="icon-btn" onclick="shiftKpiCalMonth(-1)" title="Previous month">${ICON_CHEVRON_LEFT}</button>
      <span class="kpi-cal-month">${monthLabel}</span>
      <button class="icon-btn" onclick="shiftKpiCalMonth(1)" title="Next month"
        ${atCurrentMonth?'disabled style="opacity:.3;pointer-events:none"':''}>${ICON_CHEVRON_RIGHT}</button>
    </div>
    <div class="kpi-cal-dow"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
    <div class="kpi-cal-grid">${cells}</div>
    <div class="kpi-cal-foot">
      ${c.pendingFrom
        ? `<span class="kpi-cal-hint"><b>${fmtLong(c.pendingFrom)}</b> — now pick the end day</span>`
        : `<span class="kpi-cal-hint">Click a start day, then an end day</span>`}
      <button class="btn btn-sm" onclick="closeKpiRangeCalendar()">Close</button>
    </div>
  </div>`;
}

// The most recently completed calendar week, Sunday-Saturday, to match the
// week grid on the Calendar tab. Sits alongside "Last month" as the other
// "a period that has actually finished" option: mid-week this shows all of
// last week rather than a partial current one.
function kpiLastCalendarWeek(){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay());   // Sunday that starts this week
  d.setDate(d.getDate() - 1);            // back one day = last Saturday
  const to = isoLocal(d);
  d.setDate(d.getDate() - 6);            // and the Sunday that began it
  return {from: isoLocal(d), to};
}
function resolveKpiTrackerRange(){
  const mode = getKpiTrackerRangeMode();
  if(mode === 'lastWeek'){
    const r = kpiLastCalendarWeek();
    return {from: r.from, to: r.to, label: 'Last week'};
  }
  if(mode === 'lastMonth'){
    const r = kpiLastCalendarMonth();
    return {from: r.from, to: r.to, label: 'Last month'};
  }
  if(mode === 'custom'){
    const r = getKpiTrackerCustomRange();
    return {from: r.from, to: r.to, label: 'Custom range'};
  }
  const preset = KPI_TRACKER_RANGE_PRESETS[mode] || KPI_TRACKER_RANGE_PRESETS['7'];
  const w = kpiWindow(preset.days, getKpiAsOf());
  return {from: w.from, to: w.to, label: preset.label};
}
// Same-length window immediately before [from,to] — for the delta badge,
// generalizing kpiValuePrev() to an arbitrary range instead of a fixed win.
function kpiValuePrevOver(def, from, to){
  const spanDays = Math.round((asLocalDate(to) - asLocalDate(from)) / 86400000) + 1;
  const end = asLocalDate(from);
  end.setDate(end.getDate() - 1);
  const start = new Date(end);
  start.setDate(start.getDate() - (spanDays - 1));
  return kpiValueOver(def, isoLocal(start), isoLocal(end));
}
function kpiHasDataOver(def, from, to){
  if(def.calc.type === 'cohortPct' || def.calc.type === 'cohortCount'){
    const row = def.calc.basis === 'contacted' ? getCohortFromContacted(from, to) : getCohortConversion(from, to);
    return !!row && Number(row[def.calc.basis === 'contacted' ? 'contacted' : 'produced']) > 0;
  }
  if(def.calc.type === 'lostTouchAvg'){
    const row = getLostTouchAvg(from, to);
    return !!row && Number(row.lost_leads) > 0;
  }
  if(def.calc.type === 'dealTouchAvg'){
    const row = getDealTouchAvg(from, to);
    return !!row && Number(row.deals_closed) > 0;
  }
  return kpiComponentKeys(def).some(k =>
    state.kpiEntries.some(e => e.metricKey === k && e.date >= from && e.date <= to));
}
// Always trailing 7 days ending on rangeTo — the fixed "7 day goal" window,
// independent of whatever span the page is currently displaying.
function kpiGoalWindow(rangeTo){
  return kpiWindow(7, rangeTo);
}
function kpiGoalStatus(def, rangeTo){
  const gw = kpiGoalWindow(rangeTo);
  const hasData = kpiHasDataOver(def, gw.from, gw.to);
  const value = hasData ? kpiValueOver(def, gw.from, gw.to) : null;
  const target = getKpiTarget(def.key);
  return {hasData, value, target, onTrack: kpiOnTrack(def, value, target), window: gw};
}
// Some KPI_DEFS have both a 7-day and 30-day flavor of the same metric
// (smsSent7/smsSent30, buyerResp7/buyerResp30) — built for the Trends chart
// and raw Day Log, where picking a fixed window per series still makes
// sense. The Tracker page's range selector replaces that need, so here we
// show one tile per distinct label, preferring the win:7 flavor since
// that's the key any existing goal is more likely stored under.
/* ---- Tile order (ADDED 2026-08-18) --------------------------------------
   Which order the KPI squares sit in, per section, as {sectionKey: [defKey]}.
   Lives in Prefs (user_prefs.prefs) rather than localStorage, so it's the
   person's arrangement and follows them between laptop and phone — two people
   sharing a browser get their own, and one person on two devices gets the
   same one.

   Saved orders are advisory, never authoritative: a key that no longer exists
   is dropped and a def that isn't in the list yet falls in at the end in its
   natural KPI_DEFS position. That way adding or retiring a KPI can never
   strand a tile or blank a section for someone with an old order saved. */
function getKpiOrder(){
  const o = Prefs.get('kpiOrder', {});
  return (o && typeof o === 'object') ? o : {};
}
function setKpiSectionOrder(sectionKey, keys){
  Prefs.set('kpiOrder', {...getKpiOrder(), [sectionKey]: keys});
}
function clearKpiSectionOrder(sectionKey){
  const next = {...getKpiOrder()};
  delete next[sectionKey];
  Prefs.set('kpiOrder', next);
  app.render();
}
function applyKpiOrder(sectionKey, defs){
  const order = getKpiOrder()[sectionKey];
  if(!Array.isArray(order) || !order.length) return defs;
  const pos = new Map(order.map((k, i) => [k, i]));
  // Unplaced defs sort after placed ones, keeping their KPI_DEFS order
  // among themselves — a stable sort is what makes that hold.
  return defs.slice().sort((a, b) => {
    const ia = pos.has(a.key) ? pos.get(a.key) : Infinity;
    const ib = pos.has(b.key) ? pos.get(b.key) : Infinity;
    return ia - ib;
  });
}
function hasCustomKpiOrder(sectionKey){
  const o = getKpiOrder()[sectionKey];
  return Array.isArray(o) && o.length > 0;
}

/* Drag to reorder. Order is recomputed from what's on screen rather than from
   the saved array, so it stays correct even when the saved order is partial
   or stale. A drop writes the full visible order for that section. */
let _kpiDragKey = null, _kpiDragEndedAt = 0;
function kpiDragStart(e, key){
  _kpiDragKey = key;
  e.dataTransfer.setData('text/plain', key);
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('kpi-dragging');
}
function kpiDragEnd(e){
  _kpiDragKey = null;
  _kpiDragEndedAt = Date.now();
  e.currentTarget.classList.remove('kpi-dragging');
  document.querySelectorAll('.kpi-drop-before,.kpi-drop-after')
    .forEach(el => el.classList.remove('kpi-drop-before','kpi-drop-after'));
}
function kpiDragOver(e){
  if(!_kpiDragKey) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const tile = e.currentTarget;
  if(tile.dataset.kpikey === _kpiDragKey) return;
  const box = tile.getBoundingClientRect();
  const after = (e.clientX - box.left) > box.width / 2;
  tile.classList.toggle('kpi-drop-before', !after);
  tile.classList.toggle('kpi-drop-after', after);
}
function kpiDragLeave(e){
  e.currentTarget.classList.remove('kpi-drop-before','kpi-drop-after');
}
function kpiDrop(e, sectionKey){
  if(!_kpiDragKey) return;
  e.preventDefault();
  e.stopPropagation();
  const tile = e.currentTarget;
  const dropKey = tile.dataset.kpikey;
  const after = tile.classList.contains('kpi-drop-after');
  tile.classList.remove('kpi-drop-before','kpi-drop-after');
  _kpiDragEndedAt = Date.now();

  const grid = tile.closest('.kpi-tiles');
  if(!grid || dropKey === _kpiDragKey){ _kpiDragKey = null; return; }

  const keys = [...grid.querySelectorAll('.kpi-tile')].map(el => el.dataset.kpikey);
  const from = keys.indexOf(_kpiDragKey);
  if(from < 0){ _kpiDragKey = null; return; }
  keys.splice(from, 1);
  let to = keys.indexOf(dropKey);
  if(to < 0){ _kpiDragKey = null; return; }
  if(after) to += 1;
  keys.splice(to, 0, _kpiDragKey);

  _kpiDragKey = null;
  setKpiSectionOrder(sectionKey, keys);
  app.render();
}

function dedupedKpiDefsInSection(sectionKey){
  const seen = new Map();
  for(const d of kpiDefsInSection(sectionKey)){
    if(d.pairedInto) continue;   // drawn inside its partner's tile
    const existing = seen.get(d.label);
    if(!existing || (existing.win !== 7 && d.win === 7)) seen.set(d.label, d);
  }
  return applyKpiOrder(sectionKey, [...seen.values()]);
}
function dedupedActiveKpiDefs(){
  return activeKpiSections().flatMap(s => dedupedKpiDefsInSection(s.key));
}
// Paired defs (firstAttempt7 and friends) are hidden as standalone tiles but
// still carry their own goal, so anything COUNTING goals has to see them or
// the scorecard silently ignores half a card. Tile rendering keeps using the
// deduped lists; only the goal tallies use this.
function withPairedPartners(defs){
  const out = [];
  defs.forEach(d => {
    out.push(d);
    if(d.pairWith){
      const p = KPI_DEFS.find(x => x.key === d.pairWith);
      if(p) out.push(p);
    }
  });
  return out;
}

/* =========================================================
   DASHBOARD KPI SNAPSHOT
   A read-only headline: four volume numbers over the trailing
   7 days, each against the 7 days before it so the direction
   is visible at a glance. Data entry and the full breakdown
   both live in the KPIs & Tracking tab — this card exists to
   be read in two seconds, not filled in.
   ========================================================= */
// CHANGED 2026-08-18: was four raw daily counts summed over a fixed 7 days.
// Now two labelled rows mirroring the funnel — generation on top, conversion
// underneath — and every entry points at a KPI_DEFS key rather than a raw
// metric key, so the rates and time-averages here are computed by exactly the
// same code as the Tracker page. One definition, two places, no drift.
// `win` on each def is ignored: the snapshot's own 7/30 toggle supplies the
// range, and every calc type in use here recomputes for an arbitrary window.
const DASHBOARD_SNAPSHOT_ROWS = [
  {section:'leadGen', label:'Lead Generation', icon:'ti-seeding', tiles:[
    {defKey:'smsSent7',        label:'SMS Volume',              icon:'ti-message-2'},
    {defKey:'hotLeads7',       label:'Hot Leads',               icon:'ti-flame'},
    {defKey:'scProcessAvg',    label:'Avg Time to Process Lead',icon:'ti-clock'},
    {defKey:'offerPrepAvg',    label:'Avg Time to Produce Offer',icon:'ti-file-dollar'}
  ]},
  {section:'leadConv', label:'Lead Conversion', icon:'ti-arrows-right', tiles:[
    {defKey:'firstAttempt7',   label:'Avg Time to First Attempt',icon:'ti-phone-plus'},
    {defKey:'pctContacted7',   label:'% New Leads Contacted',   icon:'ti-phone-call'},
    {defKey:'contractSentAvg', label:'Avg Time to Contract Sent',icon:'ti-file-text'},
    {defKey:'pctContract7',    label:'% Contract Sent',         icon:'ti-file-check'},
    {defKey:'pctClosed7',      label:'% Deals Closed',          icon:'ti-diamond'}
  ]}
];

// Which window the snapshot reports. Device-local: it's a viewing preference,
// not shared team state, so it sits in localStorage rather than user_prefs.
function getSnapshotWindow(){
  const v = parseInt(localStorage.getItem('ulc_snapWin'), 10);
  return v === 30 ? 30 : 7;
}
function setSnapshotWindow(days){
  localStorage.setItem('ulc_snapWin', String(days));
  app.render();
}

// The 7 days before the current 7-day window, for the trend comparison.
function kpiPrevWindow(days){
  const w = kpiWindow(days);
  const end = asLocalDate(w.from);
  end.setDate(end.getDate() - 1);
  const start = new Date(end);
  start.setDate(start.getDate() - (days - 1));
  return {from: isoLocal(start), to: isoLocal(end)};
}

/* ---- Snapshot goals (2026-08-18) ---------------------------------------
   The snapshot used to show "% vs prior period", which answers "are we busier
   than last week" — interesting, but not the question the dashboard is for.
   It's now measured against the goal instead: am I on track or not.

   Scaling a 7-day goal to the 30-day view is only valid for metrics that
   ACCUMULATE. A volume target (14,000 SMS a week) becomes 60,000 over 30
   days. A rate or a duration does NOT: "reply within 48 hours" is 48 hours
   whether you look at a week or a month, and "60% of leads contacted" is 60%
   either way. Multiplying those by 30/7 would invent a 205-hour target and
   a 257% one — numbers that look authoritative and are meaningless.

   So the scaling test is the unit: counts accumulate, hours and percentages
   don't. Anything added later inherits the right behaviour from its unit. */
const SNAPSHOT_GOAL_SCALES = unit => unit === 'count';

function snapshotGoal(def, days){
  const base = getKpiTarget(def.key);            // goals are always set per 7 days
  if(base === null || base === undefined) return null;
  return SNAPSHOT_GOAL_SCALES(def.unit) ? base * (days / 7) : base;
}

/* The line under each number: where it sits against the goal, and which way
   that reads. Returns the class the tile colours itself with, so "good" is
   green whether good means bigger (volume) or smaller (time-to). */
function snapshotGoalNote(def, value, days){
  const target = snapshotGoal(def, days);
  const cmp = def.dir === 'down' ? '≤' : '≥';

  if(target === null) return {cls:'flat', text:'No goal set', icon:''};
  const targetTxt = kpiFormat(target, def.unit);
  if(value === null)  return {cls:'flat', text:`goal ${cmp} ${targetTxt}`, icon:''};

  const onTrack = def.dir === 'down' ? value <= target : value >= target;

  if(def.dir === 'down'){
    // Time-to metrics: say how far over or under, which is more useful than
    // a bare percentage of an upper bound.
    const off = target ? Math.round(Math.abs(value - target) / target * 100) : 0;
    const word = onTrack ? 'under' : 'over';
    return {cls: onTrack ? 'up' : 'down', icon: onTrack ? 'ti-check' : 'ti-alert-triangle',
            text: off === 0 ? `at goal ${targetTxt}` : `${off}% ${word} goal ${targetTxt}`};
  }
  // Volume and rate metrics: share of the goal reached so far.
  const pct = target ? Math.round(value / target * 100) : 0;
  return {cls: onTrack ? 'up' : 'down', icon: onTrack ? 'ti-check' : '',
          text: `${pct}% of goal ${targetTxt}`};
}

function renderKpiSection(){
  const days = getSnapshotWindow();
  const w = kpiWindow(days);
  const logged = kpiDaysLogged(w.from, w.to);

  const tile = t => {
    const def = KPI_DEFS.find(d => d.key === t.defKey);
    if(!def) return '';
    const value = kpiHasDataOver(def, w.from, w.to) ? kpiValueOver(def, w.from, w.to) : null;
    const g = snapshotGoalNote(def, value, days);

    return `<div class="snap-tile" onclick="openKpiBreakdown('${def.key}','${w.from}','${w.to}','Last ${days} days')"
                 title="See the numbers behind this KPI" style="cursor:pointer">
      <div class="snap-label"><i class="ti ${t.icon}"></i> ${escape(t.label)}</div>
      <div class="snap-value">${value !== null ? kpiFormat(value, def.unit) : '—'}</div>
      <div class="snap-delta ${g.cls}">
        ${g.icon ? `<i class="ti ${g.icon}"></i> ` : ''}${escape(g.text)}
      </div>
    </div>`;
  };

  const row = r => `<div class="snap-row">
      <div class="snap-row-head"><i class="ti ${r.icon}"></i>${escape(r.label)}</div>
      <div class="snap-grid">${r.tiles.map(tile).join('')}</div>
    </div>`;

  const winBtn = n => `<button class="btn btn-sm ${days===n?'btn-primary':''}"
    onclick="event.stopPropagation();setSnapshotWindow(${n})">${n} days</button>`;

  return `<div class="card" style="margin-bottom:24px">
    <div class="card-header" style="flex-wrap:wrap;gap:10px">
      <div>
        <div class="card-title">KPI Snapshot</div>
        <div class="card-sub">Last ${days} days · ${fmtLong(w.from)} – ${fmtLong(w.to)} · ${logged}/${days} days logged${days===30?` · volume goals scaled ×${(30/7).toFixed(1)}`:''}</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <div class="seg" style="display:flex;gap:4px">${winBtn(7)}${winBtn(30)}</div>
        <button class="btn btn-sm" onclick="app.go('activity');setKtTab('kpis')">Full breakdown <i class="ti ti-arrow-right"></i></button>
      </div>
    </div>
    ${DASHBOARD_SNAPSHOT_ROWS.filter(r => isKpiSectionActive(r.section)).map(row).join('')}
  </div>`;
}

/* =========================================================
   FIRM PERFORMANCE DASHBOARD
   One tile per KPI, grouped into the four pipeline stages.
   Everything is computed as of a single selected day: pick a
   date and each tile's trailing window ends on it, so averages
   and percentages read exactly as they did that day.
   ========================================================= */

// SMS is paced rather than compared: the monthly goal implies a 7-day pace,
// and the 7-day rate as of the selected day implies where the month lands.
function kpiSmsPacing(anchor){
  const monthly = getKpiTarget('smsMonthlyGoal');
  const w7 = kpiWindow(7, anchor), w30 = kpiWindow(30, anchor);
  const sent7 = kpiSum('smsSent', w7.from, w7.to);
  return {
    monthly,
    sent7,
    sent30: kpiSum('smsSent', w30.from, w30.to),
    weeklyTarget: monthly ? (monthly / 30) * 7 : null,
    projected30: sent7 ? Math.round((sent7 / 7) * 30) : 0
  };
}

/* ---- KPI breakdown ("show your work") -----------------------------------
   ADDED 2026-08-17. The tile itself only ever showed the one computed
   number; figuring out whether that number was right meant opening the
   per-day log form and mentally re-deriving the formula. This computes the
   same components kpiValueOver() already combines -- for whatever range is
   currently selected, not just one day -- and hands them back as plain rows
   so the breakdown modal below can show its work: the formula in words, the
   raw numbers that went into it, and the same result the tile displays.    */
function kpiBreakdownRows(def, from, to){
  const c = def.calc;
  const labelFor = key => (KPI_INPUT_BY_KEY[key] || {}).label || key;
  const unitFor = key => (KPI_INPUT_BY_KEY[key] || {}).unit || 'num';

  if(c.type === 'sum'){
    const total = kpiSum(c.of, from, to);
    return {
      formula: `${escape(def.label)} = sum of "${escape(labelFor(c.of))}" logged on each day in this range.`,
      rows: [{label: labelFor(c.of), value: kpiFormat(total, unitFor(c.of))}],
      editable: true
    };
  }
  if(c.type === 'ratio'){
    const numV = kpiSum(c.num, from, to), denV = kpiSum(c.den, from, to);
    const result = denV ? (numV / denV) * 100 : null;
    return {
      formula: `${escape(def.label)} = (${escape(labelFor(c.num))} ÷ ${escape(labelFor(c.den))}) × 100, each summed across this range.`,
      rows: [
        {label: labelFor(c.num), value: kpiFormat(numV, unitFor(c.num))},
        {label: labelFor(c.den), value: kpiFormat(denV, unitFor(c.den))}
      ],
      result: kpiFormat(result, 'pct'),
      editable: true
    };
  }
  if(c.type === 'avg'){
    const totV = kpiSum(c.total, from, to), cntV = kpiSum(c.count, from, to);
    const result = cntV ? totV / cntV : null;
    return {
      formula: `${escape(def.label)} = ${escape(labelFor(c.total))} ÷ ${escape(labelFor(c.count))}, each summed across this range first, then divided once.`,
      rows: [
        {label: labelFor(c.total), value: kpiFormat(totV, unitFor(c.total))},
        {label: labelFor(c.count), value: kpiFormat(cntV, unitFor(c.count))}
      ],
      result: kpiFormat(result, def.unit),
      editable: true
    };
  }
  if(c.type === 'latest'){
    const rows = state.kpiEntries.filter(e => e.metricKey === c.of && e.date >= from && e.date <= to);
    const base = {
      formula: `${escape(def.label)} reads the most recently logged "${escape(labelFor(c.of))}" in this range -- a single day's snapshot, not summed across days.`,
      editable: true
    };
    if(!rows.length) return {...base, rows: []};
    const latest = rows.reduce((a,b) => a.date > b.date ? a : b);
    return {...base, rows: [{label: `${labelFor(c.of)} on ${fmtLong(latest.date)}`, value: kpiFormat(latest.value, unitFor(c.of))}]};
  }
  if(c.type === 'cohortPct' || c.type === 'cohortCount'){
    const COHORT_LABELS = {contacted:'Leads contacted', offered:'Leads offered on', contract_sent:'Contracts sent', closed:'Deals closed'};
    const countField = c.type === 'cohortCount' ? c.field : c.field.replace(/^pct_/, '');
    const countLabel = COHORT_LABELS[countField] || countField;
    const contactedBasis = c.basis === 'contacted';
    const denomKey = contactedBasis ? 'contacted' : 'produced';
    const denomLabel = contactedBasis ? 'Leads contacted in this range' : 'Leads produced in this range';
    const cohortVerb = contactedBasis ? 'contacted in this range' : 'produced in this range';
    const base = {
      formula: c.type === 'cohortCount'
        ? `${escape(def.label)} = leads ${cohortVerb} that have EVER gone on to reach "${escape(countLabel)}" (checked against their full history, not just this range).`
        : `${escape(def.label)} = (leads ${cohortVerb} that reached "${escape(countLabel)}" ÷ leads ${cohortVerb}) × 100 -- checked against full history.`,
      editable: false, live: true
    };
    const row = contactedBasis ? getCohortFromContacted(from, to) : getCohortConversion(from, to);
    if(!row) return {...base, rows: []};
    const denom = Number(row[denomKey]) || 0, count = Number(row[countField]) || 0;
    const pct = denom ? (count / denom) * 100 : 0;
    return {...base,
      rows: [
        {label: denomLabel, value: kpiFormat(denom, 'count')},
        {label: countLabel, value: kpiFormat(count, 'count')}
      ],
      result: c.type === 'cohortCount' ? kpiFormat(count, 'count') : kpiFormat(pct, 'pct')
    };
  }
  if(c.type === 'lostTouchAvg' || c.type === 'dealTouchAvg'){
    const lost = c.type === 'lostTouchAvg';
    const countKey = lost ? 'lost_leads' : 'deals_closed';
    const countLabel = lost ? 'Leads marked Lost Leads in this range' : 'Deals closed in this range';
    const moment = lost ? 'it was marked Lost Leads' : 'its deal closed';
    const base = {
      formula: `${escape(def.label)} = average number of inbound/outbound touches (calls + texts) each qualifying lead got before ${moment}, across every lead whose first-ever moment of that landed in this range.`,
      editable: false, live: true
    };
    const row = lost ? getLostTouchAvg(from, to) : getDealTouchAvg(from, to);
    if(!row) return {...base, rows: []};
    const count = Number(row[countKey]) || 0, avg = Number(row.avg_touches) || 0;
    return {...base,
      rows: [
        {label: countLabel, value: kpiFormat(count, 'count')},
        {label: 'Avg touches per lead', value: kpiFormat(avg, 'num')}
      ],
      result: kpiFormat(avg, 'num')
    };
  }
  return {formula: '', rows: [], editable: false};
}

function openKpiBreakdown(defKey, from, to, rangeLabel){
  // A drag that ends over the tile it started on still fires a click. Without
  // this guard, nudging a square open the breakdown modal every time.
  if(Date.now() - _kpiDragEndedAt < 300) return;
  const def = KPI_DEFS.find(d => d.key === defKey);
  if(!def) return;
  const b = kpiBreakdownRows(def, from, to);
  const hasData = kpiHasDataOver(def, from, to);
  const value = hasData ? kpiValueOver(def, from, to) : null;

  showModal(`<div class="modal" style="max-width:440px">
    <div class="modal-header">
      <h2 class="modal-title">${escape(def.label)}</h2>
      <button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="form-hint" style="margin-bottom:2px">${escape(rangeLabel)} · ${fmtLong(from)} – ${fmtLong(to)}</div>
    <div class="kpi-tile-val" style="margin:6px 0 12px">${value !== null ? kpiFormat(value, def.unit) : '—'}</div>
    ${b.formula ? `<div class="form-hint" style="margin-bottom:10px">${b.formula}</div>` : ''}
    ${b.rows.length ? `
      <div class="kpi-history">
        ${b.rows.map(r => `<div class="kpi-history-row">
          <span class="kpi-history-date">${escape(r.label)}</span>
          <span class="kpi-history-val">${escape(r.value)}</span>
        </div>`).join('')}
      </div>` : `<div class="kpi-note">No entries in this range yet.</div>`}
    <div class="page-eyebrow" style="margin-top:14px">Data source</div>
    <div class="form-hint">${escape(def.source || 'Source not documented yet.')}</div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Close</button>
      ${b.editable ? `<button class="btn btn-primary" onclick="closeModal();openKpiComboForm(KPI_DEFS.find(d=>d.key==='${defKey}'), '${to}')">Log a day's numbers</button>` : ''}
    </div>
  </div>`);
}

function renderKpiTile(def, range){
  // A tile is one or two stat blocks. Two when `pairWith` names a partner def
  // (see firstContact7): both get the same size, their own goal and their own
  // breakdown, and the card spans two grid rows so it reads as two stacked
  // cards rather than one crowded one.
  const partner = def.pairWith ? KPI_DEFS.find(d => d.key === def.pairWith) : null;
  const blocks  = partner ? [def, partner] : [def];
  const dual    = blocks.length > 1;

  const rendered = blocks.map((d, idx) => renderKpiStat(d, range, {showWindow: idx === 0}));
  const tileCls  = dual ? 'kpi-tile kpi-tile-dual' : `kpi-tile ${rendered[0].cls}`;

  // Drag-to-reorder attributes are identical for both shapes; a paired tile
  // moves as one unit under its primary def's key.
  const dnd = `data-kpikey="${def.key}" draggable="true"
    ondragstart="kpiDragStart(event,'${def.key}')" ondragend="kpiDragEnd(event)"
    ondragover="kpiDragOver(event)" ondragleave="kpiDragLeave(event)"
    ondrop="kpiDrop(event,'${def.section}')"`;

  if(dual){
    return `<div class="${tileCls}" ${dnd}>${rendered.map(r => r.html).join('')}</div>`;
  }
  return `<div class="${tileCls}" ${dnd} onclick="openKpiBreakdown('${def.key}','${range.from}','${range.to}','${escape(range.label)}')" title="See the numbers behind this KPI · drag to reorder">${rendered[0].inner}</div>`;
}

// One stat: value, trend vs the previous equivalent window, and its own goal.
// Returned both wrapped (for dual tiles) and bare (for single tiles) so the
// two layouts share exactly one copy of this logic.
function renderKpiStat(def, range, opts){
  const showWindow = !opts || opts.showWindow !== false;
  const value = kpiValueOver(def, range.from, range.to);
  const prev  = kpiValuePrevOver(def, range.from, range.to);
  const hasData = kpiHasDataOver(def, range.from, range.to);

  // The goal is always trailing 7 days ending on range.to, regardless of
  // what range is selected for the headline value above — see kpiGoalStatus().
  const { target, onTrack, value: goalValue } = kpiGoalStatus(def, range.to);

  // Percent change against the previous equivalent window. For a 'down' KPI a
  // fall is an improvement, so the colour is keyed to better/worse, not sign.
  let delta = '';
  if(hasData && value !== null && prev !== null && prev !== 0){
    const pct = ((value - prev) / Math.abs(prev)) * 100;
    if(Math.abs(pct) >= 0.5){
      const better = def.dir === 'down' ? pct < 0 : pct > 0;
      delta = `<span class="kpi-tile-delta ${better?'up':'down'}" title="vs previous ${range.label.toLowerCase()}">
        ${pct>0?'+':''}${pct.toFixed(0)}%</span>`;
    }else{
      delta = `<span class="kpi-tile-delta flat" title="vs previous ${range.label.toLowerCase()}">flat</span>`;
    }
  }

  // Goal row: a progress bar toward the 7 day goal, or an invitation to set one.
  let goalRow;
  if(target !== null && goalValue !== null){
    // For a 'down' KPI, "full" means at or under the goal.
    const ratio = def.dir === 'down'
      ? (goalValue <= target ? 1 : Math.max(0, target / goalValue))
      : Math.min(1, goalValue / (target || 1));
    goalRow = `<div class="kpi-bar"><div class="kpi-bar-fill" style="width:${Math.round(ratio*100)}%;background:${onTrack?'var(--success-ink)':'var(--danger)'}"></div></div>
      <div class="kpi-tile-goal">
        <span>7 day goal ${def.dir==='down'?'≤':'≥'} <b>${kpiFormat(target, def.unit)}</b>
          <span style="color:var(--ink-3)">(${kpiFormat(goalValue, def.unit)} now)</span></span>
        <button class="kpi-goal-set" onclick="event.stopPropagation();openKpiGoalForm('${def.key}')">Edit</button>
      </div>`;
  }else{
    goalRow = `<div class="kpi-tile-goal">
        <span>No 7 day goal set</span>
        <button class="kpi-goal-set" onclick="event.stopPropagation();openKpiGoalForm('${def.key}')">Set goal</button>
      </div>`;
  }

  const cls = !hasData ? 'no-data' : onTrack === true ? 'is-good' : onTrack === false ? 'is-bad' : '';
  const pacing = def.pace === 'smsMonthlyGoal' ? renderSmsPacingNote(range.to) : '';

  const inner = `<div class="kpi-tile-head">
      <div class="kpi-tile-name">${escape(def.label)}</div>
      ${showWindow ? `<div class="kpi-tile-win">${escape(range.label)}</div>` : ''}
    </div>
    <div class="kpi-tile-val">${hasData ? kpiFormat(value, def.unit) : '—'}${delta}</div>
    ${hasData ? '' : `<div class="kpi-note" style="color:var(--danger)">No entries in this window</div>`}
    ${pacing}
    ${goalRow}`;

  const html = `<div class="kpi-stat ${cls}" onclick="openKpiBreakdown('${def.key}','${range.from}','${range.to}','${escape(range.label)}')" title="See the numbers behind this KPI">${inner}</div>`;
  return {html, inner, cls};
}

function renderSmsPacingNote(anchor){
  const p = kpiSmsPacing(anchor);
  if(!p.monthly) return `<div class="kpi-note">Set a monthly goal to pace this.</div>`;
  const pace = p.sent7 >= p.weeklyTarget;
  return `<div class="kpi-note">
    Weekly pace needed <b>${Math.round(p.weeklyTarget)}</b> ·
    <span style="color:${pace?'var(--success-ink)':'var(--danger)'};font-weight:600">${pace?'on pace':'behind pace'}</span><br>
    30-day projection <b>${p.projected30}</b> of <b>${p.monthly}</b>
  </div>`;
}

// The KPIs half of the KPIs & Tracking tab. Everything here is reported as of

  const rangeSpanDays = Math.round((asLocalDate(range.to) - asLocalDate(range.from)) / 86400000) + 1;

  // Scorecard is always about the fixed 7 day goal, independent of the
  // range selected for the tiles' headline values below.
  const scored  = withPairedPartners(defs);
  const judged  = scored.filter(d => { const g = kpiGoalStatus(d, range.to); return g.target !== null && g.hasData; });
  const metCount = judged.filter(d => kpiGoalStatus(d, range.to).onTrack).length;

          <div class="card-sub">${secScored.length} KPI${secScored.length!==1?'s':''}${sNoData?` · ${sNoData} without a 7 day goal met`:''} · drag to reorder${hasCustomKpiOrder(s.key)?` · <button class="kpi-order-reset" onclick="event.stopPropagation();clearKpiSectionOrder('${s.key}')">reset order</button>`:''}</div>
        </div>

               <i class="ti ${sOk===sJudged.length?'ti-check':'ti-alert-triangle'}"></i> ${sOk}/${sJudged.length} 7 day goals met

      </div>
      <div class="kpi-tiles">${secDefs.map(d => renderKpiTile(d, range)).join('')}</div>

  };

  const rangePill = (val, label) => `<button class="btn btn-sm ${mode===val?'btn-primary':''}"

  return `
  <div class="card" style="margin-bottom:16px">
    <div class="card-header" style="flex-wrap:wrap;gap:10px">
      <div>
        <div class="card-title">Firm performance</div>
        <div class="card-sub">Showing ${range.label.toLowerCase()} (${fmtLong(range.from)} – ${fmtLong(range.to)}) · ${loggedOnDay}/${inputs.length} inputs logged ${isToday?'today':'on '+fmtLong(asOf)}</div>
      </div>
    </div>

    <div class="kpi-range">
      <span class="kpi-range-label"><i class="ti ti-calendar-stats"></i> Range</span>
      ${rangePill('7','7 days')}
      ${rangePill('30','30 days')}
      ${rangePill('90','90 days')}
      ${rangePill('lastWeek','Last week')}
      ${rangePill('lastMonth','Last month')}
      ${rangePill('custom','Custom')}
    </div>

    ${mode === 'custom' ? `
    <div class="kpi-range">
      <span class="kpi-range-label"><i class="ti ti-calendar-due"></i> Custom range</span>
      <div class="kpi-range-picker">
        <button class="btn btn-sm kpi-cal-trigger ${getKpiCal().open?'open':''}"
                onclick="toggleKpiRangeCalendar()">
          <i class="ti ti-calendar"></i>
          <span>${fmtLong(range.from)} – ${fmtLong(range.to)}</span>
          <i class="ti ti-chevron-down" style="font-size:14px;opacity:.6"></i>
        </button>
        ${getKpiCal().open ? renderKpiRangeCalendar(range) : ''}
      </div>
      <span class="kpi-range-note">${rangeSpanDays} day${rangeSpanDays!==1?'s':''} · ${kpiDaysLogged(range.from, range.to)} logged</span>
    </div>` : mode === 'lastWeek' ? `
    <div class="kpi-range">
      <span class="kpi-range-note">Fixed to the most recently completed calendar week (Sunday–Saturday).</span>
    </div>` : mode === 'lastMonth' ? `
    <div class="kpi-range">

      <span class="kpi-range-label"><i class="ti ti-calendar-event"></i> Ends on</span>
      <button class="icon-btn" onclick="shiftKpiAsOf(-1)" title="Previous day"><i class="ti ti-chevron-left"></i></button>

      ${isToday
        ? `<span class="kpi-range-note">Range ends today</span>`
        : `<button class="btn btn-sm" onclick="setKpiAsOf('${today()}')"><i class="ti ti-calendar-event"></i> Today</button>
