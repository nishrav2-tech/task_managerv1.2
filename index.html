      Missing: ${noData.slice(0,6).map(d=>escape(d.label)).join(' · ')}${noData.length>6?` · +${noData.length-6} more`:''}
    </div>` : ''}
  </div>

  ${activeKpiSections().map(section).join('')}

  ${renderKpiChart()}`;
}



/* =========================================================
   KPI TRENDS CHART
   Plot any KPI (or any raw input) over any range, with an
   optional second series to compare against.

   A derived KPI is plotted as its *rolling* value: at each day
   on the x-axis the line shows what that KPI read as of that
   day, using its own trailing window. That's the honest way to
   chart a 7-day average — plotting one day's raw ratio would be
   noise. Raw inputs are plotted as the day's own number.

   Days with nothing to compute break the line rather than
   drawing a zero, so a gap in the data looks like a gap.
   ========================================================= */
const KPI_CHART_RANGES = {7:'Last 7 days', 14:'Last 14 days', 30:'Last 30 days', 60:'Last 60 days', 90:'Last 90 days', 180:'Last 180 days'};
const KPI_CHART_COLOR_A = 'var(--accent)';
const KPI_CHART_COLOR_B = 'var(--info-ink)';

function getKpiChart(){
  if(state.kpiChart === undefined){
    const c = Prefs.get('kpiChart', null);
    state.kpiChart = c && c.a ? c : {a:'kpi:smsSent7', b:'', range:30};
  }
  return state.kpiChart;
}
function setKpiChart(part, value){
  state.kpiChart = {...getKpiChart(), [part]: part==='range' ? parseInt(value,10)||30 : value};
  Prefs.set('kpiChart', state.kpiChart);
  app.render();
}

// A selection is either "kpi:<defKey>" (rolling) or "in:<inputKey>" (daily).
function kpiChartSeriesMeta(sel){
  if(!sel) return null;
  const [kind, key] = sel.split(':');
  if(kind === 'kpi'){
    const def = activeKpiDefs().find(d => d.key === key);
    if(!def) return null;
    return {kind, def, label: def.label, unit: def.unit, sub: `${kpiWindowLabel(def.win)} rolling`};
  }
  const inp = activeKpiInputs().find(m => m.key === key);
  if(!inp) return null;
  return {kind, input: inp, label: inp.label, unit: inp.unit, sub: 'logged that day'};
}
// One point per day in the range. `value` is null where there's nothing to show.
function buildKpiChartSeries(meta, days){
  const end = new Date(), out = [];
  for(let i = days - 1; i >= 0; i--){
    const d = new Date(end);
    d.setDate(d.getDate() - i);
    const date = isoLocal(d);
    let value = null;
    if(meta.kind === 'kpi'){
      value = kpiHasData(meta.def, null, date) ? kpiValue(meta.def, null, date) : null;
    }else{
      const e = getKpiEntry(meta.input.key, date);
      value = e ? Number(e.value) : null;
    }
    out.push({date, value});
  }
  return out;
}

function renderKpiChart(){
  const cfg = getKpiChart();
  const days = cfg.range;
  const metaA = kpiChartSeriesMeta(cfg.a) || kpiChartSeriesMeta('in:' + activeKpiInputs()[0].key);
  const metaB = cfg.b ? kpiChartSeriesMeta(cfg.b) : null;
  const seriesA = buildKpiChartSeries(metaA, days);
  const seriesB = metaB ? buildKpiChartSeries(metaB, days) : null;

  const vals = [...seriesA, ...(seriesB||[])].map(p=>p.value).filter(v => v !== null);
  const maxVal = Math.max(1, ...vals);
  const anyData = vals.length > 0;

  const W = 680, H = 240, padL = 34, padR = 12, padT = 14, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = seriesA.length;
  const xFor = i => padL + (n<=1 ? 0 : (i/(n-1))*plotW);
  const yFor = v => padT + plotH - (v/maxVal)*plotH;

  // Build one path per unbroken run of data, so gaps stay gaps.
  const pathsFor = series => {
    const runs = [];
    let cur = [];
    series.forEach((p,i)=>{
      if(p.value === null){ if(cur.length) runs.push(cur); cur = []; }
      else cur.push({i, v:p.value});
    });
    if(cur.length) runs.push(cur);
    return runs;
  };
  const drawSeries = (series, color, dashed) => {
    const runs = pathsFor(series);
    return runs.map(run => {
      // A lone point has no line to draw, so mark it with a dot instead.
      if(run.length === 1){
        return `<circle cx="${xFor(run[0].i).toFixed(1)}" cy="${yFor(run[0].v).toFixed(1)}" r="3" fill="${color}"/>`;
      }
      const dPath = run.map((pt,k)=>`${k===0?'M':'L'}${xFor(pt.i).toFixed(1)},${yFor(pt.v).toFixed(1)}`).join(' ');
      return `<path d="${dPath}" fill="none" stroke="${color}" stroke-width="2.25"
        stroke-linejoin="round" stroke-linecap="round" ${dashed?'stroke-dasharray="5,3"':''}/>`;
    }).join('');
  };

  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + plotH - f*plotH;
    const v = maxVal*f;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--ink-3)" text-anchor="end">${v>=10?Math.round(v):v.toFixed(1).replace(/\.0$/,'')}</text>`;
  }).join('');

  const labelCount = Math.min(6, n);
  const xLabels = [];
  for(let k=0;k<labelCount;k++){
    const idx = n<=1 ? 0 : Math.round(k*(n-1)/((labelCount-1)||1));
    const d = asLocalDate(seriesA[idx].date);
    xLabels.push(`<text x="${xFor(idx).toFixed(1)}" y="${H-8}" font-size="9" fill="var(--ink-3)" text-anchor="middle">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`);
  }

  // Goal line, when the primary series is a KPI with an expectation set.
  let goalLine = '';
  if(metaA.kind === 'kpi'){
    const t = getKpiTarget(metaA.def.key);
    if(t !== null && t <= maxVal){
      const y = yFor(t).toFixed(1);
      goalLine = `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="var(--danger)" stroke-width="1.25" stroke-dasharray="4,4"/>
        <text x="${W-padR}" y="${(Number(y)-4).toFixed(1)}" font-size="9" fill="var(--danger)" text-anchor="end">goal ${kpiFormat(t, metaA.unit)}</text>`;
    }
  }

  // Legend summary: latest reading, plus the range total for raw counts.
  const summarise = (meta, series) => {
    const pts = series.filter(p=>p.value!==null);
    if(!pts.length) return 'no data';
    const latest = pts[pts.length-1];
    const bits = [`latest ${kpiFormat(latest.value, meta.unit)}`];
    if(meta.kind === 'in' && meta.unit === 'count'){
      bits.push(`${pts.reduce((s,p)=>s+p.value,0)} total`);
    }
    bits.push(`${pts.length}/${series.length} days`);
    return bits.join(' · ');
  };

  // CHANGED 2026-08-18: rolling KPI series removed from this picker -- only
  // raw daily inputs are offered now. A rolling KPI plotted per-day is a
  // trailing average of itself, which smooths away the day-to-day movement
  // the chart exists to show, and the derived tiles above already report
  // those numbers for the selected range. kpiChartSeriesMeta still resolves
  // 'kpi:' selections so a series saved under the old picker keeps drawing
  // until it's changed.
  const optionsFor = selected => `
    ${activeKpiInputs().map(m=>`<option value="in:${m.key}" ${selected===`in:${m.key}`?'selected':''}>${escape(m.label)}</option>`).join('')}`;

  const mixedUnits = metaB && metaB.unit !== metaA.unit;

  return `<div class="card" style="margin-bottom:16px">
    <div class="card-header" style="flex-wrap:wrap;gap:10px">
      <div>
        <div class="card-title">KPI trends</div>
        <div class="card-sub">Raw daily numbers — pick up to two to compare over the range</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <select class="filter-select" style="min-width:120px" onchange="setKpiChart('range', this.value)">
          ${Object.entries(KPI_CHART_RANGES).map(([k,v])=>`<option value="${k}" ${String(days)===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <select class="filter-select" style="min-width:200px" onchange="setKpiChart('a', this.value)">
          ${optionsFor(cfg.a)}
        </select>
        <select class="filter-select" style="min-width:200px" onchange="setKpiChart('b', this.value)">
          <option value="" ${cfg.b?'':'selected'}>Compare to…</option>
          ${optionsFor(cfg.b)}
        </select>
      </div>
    </div>

    <div style="display:flex;gap:18px;margin-bottom:10px;font-size:12px;flex-wrap:wrap">
      <span style="display:flex;align-items:center;gap:6px">
        <span style="width:14px;height:3px;border-radius:2px;background:${KPI_CHART_COLOR_A};display:inline-block"></span>
        <b>${escape(metaA.label)}</b> <span style="color:var(--ink-3)">${metaA.sub} · ${summarise(metaA, seriesA)}</span>
      </span>
      ${metaB?`<span style="display:flex;align-items:center;gap:6px">
        <span style="width:14px;height:0;border-top:3px dashed ${KPI_CHART_COLOR_B};display:inline-block"></span>
        <b>${escape(metaB.label)}</b> <span style="color:var(--ink-3)">${metaB.sub} · ${summarise(metaB, seriesB)}</span>
      </span>`:''}
    </div>
    ${mixedUnits?`<div class="kpi-note" style="margin-bottom:8px">
      Different units (${(KPI_UNIT_SUFFIX[metaA.unit]||'count').trim()||'count'} vs ${(KPI_UNIT_SUFFIX[metaB.unit]||'count').trim()||'count'}) — both share one axis, so compare the shapes rather than the heights.
    </div>`:''}

    ${anyData ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible" role="img" aria-label="${escape(metaA.label)} over the last ${days} days">
      ${gridLines}
      ${goalLine}
      ${drawSeries(seriesA, KPI_CHART_COLOR_A, false)}
      ${seriesB ? drawSeries(seriesB, KPI_CHART_COLOR_B, true) : ''}
      ${xLabels.join('')}
    </svg>`
    : `<div class="empty" style="padding:30px">
         <i class="ti ti-chart-line"></i>
         <h3>Nothing to plot yet</h3>
         <p>No entries for ${escape(metaA.label)} in the last ${days} days. Fill in the form below and it'll appear here.</p>
       </div>`}
  </div>`;
}

/* One modal, two modes.
   - Single input: opened from a figure in the raw-inputs table. One number,
     with that input's recent history underneath.
   - KPI mode (defKey): opened from a tile. Shows every input that feeds that
     KPI side by side, because they're only meaningful logged together — a
     count of offers without the hours spent on them yields no average.
   Time totals accept decimals; counts stay whole.                          */
const kpiStepFor = unit => unit === 'count' ? '1' : 'any';

function openKpiLogForm(metricKey, dateStr, defKey){
  const date = dateStr || today();
  const def = defKey ? KPI_DEFS.find(d => d.key === defKey) : null;

  if(def) return openKpiComboForm(def, date);

  const key = activeKpiInputs().some(m=>m.key===metricKey) ? metricKey : activeKpiInputs()[0].key;
  const m = KPI_INPUT_BY_KEY[key];
  const existing = getKpiEntry(key, date);
  const history = kpiEntriesFor(key).slice(0, 10);

  showModal(`<div class="modal" style="max-width:440px">
    <div class="modal-header">
      <h2 class="modal-title">Log daily input</h2>
      <button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Input</label>
        <select class="form-select" id="fk-metric" onchange="reopenKpiLogForm()">
          ${activeKpiSections().map(s=>`<optgroup label="${escape(s.label)}">
            ${kpiInputsInSection(s.key).map(x=>`<option value="${x.key}" ${x.key===key?'selected':''}>${escape(x.label)}</option>`).join('')}
          </optgroup>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Date</label>
        <input class="form-input" id="fk-date" type="date" value="${date}" max="${today()}" onchange="reopenKpiLogForm()">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">${escape(m.label)} on this day</label>
      <input class="form-input" id="fk-value" type="number" min="0" step="${kpiStepFor(m.unit)}" value="${existing ? existing.value : ''}" placeholder="0" autofocus>
      <div class="form-hint">${existing
        ? 'Already logged — saving overwrites this day\'s number.'
        : m.unit === 'count'
          ? 'Just this day\'s count. Trailing windows add the days up for you.'
          : `This day's total ${KPI_UNIT_SUFFIX[m.unit].trim()} across all of them — not an average.`}</div>
    </div>
    ${history.length ? `
      <div class="page-eyebrow" style="margin:16px 0 6px">Recent entries</div>
      <div class="kpi-history">
        ${history.map(e=>`<div class="kpi-history-row ${e.date===date?'current':''}">
          <span class="kpi-history-date" onclick="openKpiLogForm('${key}','${e.date}')">${fmtLong(e.date)}</span>
          <span class="kpi-history-val">${e.value}</span>
          <button class="icon-btn" title="Delete this entry" onclick="deleteKpiEntry('${e.id}')">${ICON_DELETE}</button>
        </div>`).join('')}
      </div>` : ''}
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveKpiEntry()">Save</button>
    </div>
  </div>`);
}

// Logging every input behind one KPI, for one day.
function openKpiComboForm(def, date){
  const inputs = kpiInputsFor(def);
  showModal(`<div class="modal" style="max-width:460px">
    <div class="modal-header">
      <h2 class="modal-title">${escape(def.label)}</h2>
      <button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="form-group">
      <label class="form-label">Date</label>
      <input class="form-input" id="fkc-date" type="date" value="${date}" max="${today()}"
             onchange="openKpiComboForm(KPI_DEFS.find(d=>d.key==='${def.key}'), this.value)">
    </div>
    <div class="kpi-log-group">
      <div class="kpi-log-group-title">Numbers behind this KPI</div>
      ${inputs.map(inp=>{
        const ex = getKpiEntry(inp.key, date);
        return `<div class="form-group">
          <label class="form-label">${escape(inp.label)}</label>
          <input class="form-input" data-kpi-input="${inp.key}" type="number" min="0"
                 step="${kpiStepFor(inp.unit)}" value="${ex ? ex.value : ''}" placeholder="0">
        </div>`;
      }).join('')}
      <div class="form-hint">
        ${def.calc.type === 'sum'
          ? 'Trailing windows add these days up for you.'
          : 'The window sums both across every day first, then divides once — so the average stays weighted correctly.'}
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveKpiCombo('${def.key}')">Save</button>
    </div>
  </div>`);
}
async function saveKpiCombo(defKey){
  const def = KPI_DEFS.find(d => d.key === defKey);
  const date = $('#fkc-date').value;
  if(!date){ toast('Pick a date first','err'); return; }
  const fields = [...document.querySelectorAll('[data-kpi-input]')];
  // A blank field means "not logged", which is different from logging a zero —
  // so blanks are skipped rather than written as 0.
  const toSave = fields.filter(f => f.value !== '');
  if(!toSave.length){ toast('Nothing entered','err'); return; }
  for(const f of toSave){
    await writeKpiEntry(f.dataset.kpiInput, date, Number(f.value) || 0);
  }
  await stampKpiUpdate();
  closeModal();
  toast(`Logged ${toSave.length} value${toSave.length!==1?'s':''}`);
  app.render();
}
// Shared upsert for one input on one day.
async function writeKpiEntry(metricKey, date, value){
  const existing = getKpiEntry(metricKey, date);
  const data = existing ? {...existing, value} : {id:uid(), metricKey, date, value};
  if(existing){
    state.kpiEntries[state.kpiEntries.findIndex(e => e.id === existing.id)] = data;
  }else{
    state.kpiEntries.push(data);
  }
  await saveOne('kpiEntries', data);
}

// Switching metric or date has to rebuild the modal so the existing value and
// history match what's now selected.
function reopenKpiLogForm(){
  const key = $('#fk-metric').value;
  const date = $('#fk-date').value || today();
  openKpiLogForm(key, date);
}
async function saveKpiEntry(){
  const metricKey = $('#fk-metric').value;
  const date = $('#fk-date').value;
  if(!date){ toast('Pick a date first','err'); return; }
  const value = Number($('#fk-value').value) || 0;

  const existing = getKpiEntry(metricKey, date);
  const data = existing
    ? {...existing, value}
    : {id:uid(), metricKey, date, value};
  if(existing){
    const i = state.kpiEntries.findIndex(e => e.id === existing.id);
    state.kpiEntries[i] = data;
  }else{
    state.kpiEntries.push(data);
  }
  await saveOne('kpiEntries', data);
  await stampKpiUpdate();

  closeModal();
  toast('KPI logged');
  app.render();
}
async function deleteKpiEntry(id){
  const e = state.kpiEntries.find(x => x.id === id);
  if(!e) return;
  if(!confirm(`Delete the ${fmtLong(e.date)} entry?`)) return;
  state.kpiEntries = state.kpiEntries.filter(x => x.id !== id);
  await deleteOne('kpiEntries', id);
  await stampKpiUpdate();
  closeModal();
  toast('Entry deleted');
  app.render();
}
// Single global "last updated" stamp for the whole KPI section.
async function stampKpiUpdate(){
  const metaExisting = state.kpiMeta[0];
  const metaRow = { id: metaExisting ? metaExisting.id : uid(), updatedAt: new Date().toISOString() };
  state.kpiMeta = [metaRow];
  await saveOne('kpiMeta', metaRow);
}

// calendar was removed. shiftCalendar() stays because the Team performance and

/* =========================================================
   CALENDAR TAB — full week view. Every task and project due
   each day is listed out in full (no "+N more" truncation),
   click any item to open it large in its normal edit modal.
   Scrolls to any past or future week; position is remembered.
   ========================================================= */
function getWeekCalendarOffset(){
  if(state.weekCalendarOffset === undefined){
    state.weekCalendarOffset = parseInt(Prefs.get('weekCalOffset', 0), 10) || 0;
  }
  return state.weekCalendarOffset;
}
function setWeekCalendarOffset(v){
  state.weekCalendarOffset = v;
  Prefs.set('weekCalOffset', v);
  app.render();
}
function shiftWeekCalendar(delta){
  setWeekCalendarOffset(delta===0 ? 0 : getWeekCalendarOffset()+delta);
}
// Jump the week view to whatever week contains `dateStr` (YYYY-MM-DD), so you
// can reach a date months out without clicking Next a dozen times. Both dates
// are snapped to their Sunday first, then the gap is measured in whole weeks —
// that keeps the math immune to daylight-saving shifts in between.
function jumpToWeekOf(dateStr){
  if(!dateStr) return;
  const target = new Date(dateStr+'T00:00:00');
  if(isNaN(target)) return;
  target.setHours(0,0,0,0);
  target.setDate(target.getDate() - target.getDay());
  const current = getWeekStart(0);
  setWeekCalendarOffset(Math.round((target - current) / (7*24*60*60*1000)));
}
// Sunday that starts the week `offsetWeeks` away from the current week.
function getWeekStart(offsetWeeks){
  const d = new Date();
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() - d.getDay() + offsetWeeks*7);
  return d;
}
// Who the Calendar tab is scoped to. Defaults to whoever this device is
// signed in as, so opening Calendar shows your own week rather than the
// whole team's. '' means "Everyone". Kept out of state.filters because that
// object is wiped on every tab change, and this choice should stick.
function getCalendarUserId(){
  if(state.calendarUserId === undefined){
    const stored = Prefs.get('calUser', null);
    state.calendarUserId = stored !== null ? stored : (state.activeUserId || '');
  }
  // A teammate who's since been deleted would otherwise leave the calendar
  // permanently empty with no obvious cause.
  if(state.calendarUserId && !state.users.some(u=>u.id===state.calendarUserId)){
    state.calendarUserId = '';
  }
  return state.calendarUserId;
}
function setCalendarUser(id){
  state.calendarUserId = id;
  Prefs.set('calUser', id);
  app.render();
}

// Who the Dashboard's "Today's agenda" is scoped to. Defaults to '' (Everyone)
// so the agenda never quietly hides a teammate's overdue work; the choice is
// remembered per-device. Same deleted-teammate guard as the calendar filter.
function getAgendaUserId(){
  if(state.agendaUserId === undefined){
    state.agendaUserId = Prefs.get('agendaUser', '') || '';
  }
  if(state.agendaUserId && !state.users.some(u=>u.id===state.agendaUserId)){
    state.agendaUserId = '';
  }
  return state.agendaUserId;
}
function setAgendaUser(id){
  state.agendaUserId = id;
  Prefs.set('agendaUser', id);
  app.render();
}

// The week grid, as one self-contained card on the Dashboard. This is the only
// calendar in the app now — the separate Calendar tab was removed — so it
// carries the full navigation: prev/next week, a jump back to this week, a date
// picker to leap to any arbitrary week, and the person filter. The week it's
// showing and who it's scoped to are both remembered per-device.
function renderWeekCalendarCard(){
  const offset = getWeekCalendarOffset();
  const weekStart = getWeekStart(offset);
  const days = [];
  for(let i=0;i<7;i++){ const d = new Date(weekStart); d.setDate(d.getDate()+i); days.push(d); }
  const weekEnd = days[6];
  const todayStr = today();

  const calUserId = getCalendarUserId();
  const mine = item => !calUserId || (item.assignees||[]).includes(calUserId);
  const calUserLabel = calUserId ? userName(calUserId) : 'the whole team';

  const rangeLabel = weekStart.getMonth()===weekEnd.getMonth()
    ? `${weekStart.toLocaleDateString('en-US',{month:'long'})} ${weekStart.getDate()}–${weekEnd.getDate()}, ${weekEnd.getFullYear()}`
    : `${weekStart.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${weekEnd.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}`;

  const byDate = {};
  state.tasks.forEach(t=>{ if(!t.dueDate || !mine(t)) return; (byDate[t.dueDate]=byDate[t.dueDate]||[]).push({...t,_kind:'task'}); });
  state.projects.forEach(p=>{ if(!p.dueDate || !mine(p)) return; (byDate[p.dueDate]=byDate[p.dueDate]||[]).push({...p,_kind:'project'}); });

  const totalItems = days.reduce((s,d)=>s+((byDate[isoLocal(d)]||[]).length),0);
  const isThisWeek = offset===0;

  const relLabel = offset===0 ? 'This week'
    : offset===1 ? 'Next week'
    : offset===-1 ? 'Last week'
    : offset>0 ? `${offset} weeks ahead`
    : `${Math.abs(offset)} weeks back`;

  return `
  <div class="card" style="margin-bottom:16px">
    <div class="card-header" style="flex-wrap:wrap;gap:10px">
      <div>
        <div class="page-eyebrow" style="margin-bottom:2px">Calendar · ${relLabel}</div>
        <div class="card-title">${rangeLabel}</div>
        <div class="card-sub">${totalItems} item${totalItems!==1?'s':''} this week · showing ${escape(calUserLabel)}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <button class="btn btn-sm" onclick="shiftWeekCalendar(-1)" title="Previous week">${ICON_CHEVRON_LEFT} Prev</button>
        <button class="btn btn-sm ${isThisWeek?'btn-primary':''}" onclick="shiftWeekCalendar(0)" title="Jump to this week"><i class="ti ti-calendar-event"></i> Today</button>
        <button class="btn btn-sm" onclick="shiftWeekCalendar(1)" title="Next week">Next ${ICON_CHEVRON_RIGHT}</button>
        <input type="date" class="filter-select" style="min-width:150px" value="${isoLocal(weekStart)}"
               title="Jump to the week containing this date" onchange="jumpToWeekOf(this.value)">
        <select class="filter-select" style="min-width:170px" onchange="setCalendarUser(this.value)">
          <option value="">Everyone</option>
          ${state.users.map(u=>`<option value="${u.id}" ${u.id===calUserId?'selected':''}>${escape(u.name)}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="week-grid">
      ${days.map(d=>{
        const dateStr = isoLocal(d);
        const isToday = dateStr === todayStr;
        const items = (byDate[dateStr]||[]).slice().sort((a,b)=>{
          const doneDiff = (a.status==='done') - (b.status==='done');
          if(doneDiff) return doneDiff;
          const order = {high:0, medium:1, low:2};
          return (order[a.priority]??1) - (order[b.priority]??1);
        });
        return `<div class="week-day-col ${isToday?'week-day-today':''}">
          <div class="week-day-head">
            <div class="week-day-name">${d.toLocaleDateString('en-US',{weekday:'short'})}</div>
            <div class="week-day-num">${d.getDate()}</div>
            ${items.length?`<div class="week-day-count">${items.length}</div>`:''}
          </div>
          <div class="week-day-items">
            ${items.length ? items.map(item=>{
              const isProject = item._kind==='project';
              const done = item.status==='done';
              const pri = item.priority||'medium';
              const clickFn = isProject ? `openProjectForm('${item.id}')` : `openTaskForm('${item.id}')`;
              return `<div class="week-item ${isProject?'week-item-project':'pri-'+pri}" onclick="${clickFn}" title="${escape(item.title)}">
                <div class="week-item-title" style="${done?'text-decoration:line-through;opacity:.55':''}">${isProject?'<i class="ti ti-bulb" style="font-size:11px"></i> ':''}${escape(item.title)}</div>
                <div class="week-item-meta">
                  ${isProject?`<span>${escape(item.category)}</span>`:`<span class="badge b-${pri}">${pri}</span>`}
                  ${assigneeStack(item.assignees,'sm')}
                </div>
              </div>`;
            }).join('') : `<div class="week-day-empty">Nothing scheduled</div>`}
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

}

function renderOnTimeChart(mf, monthLabel){

  return `<div class="card">
    <div class="card-header">

      <div style="display:flex;align-items:center;gap:4px">

        <button class="icon-btn" onclick="shiftCalendar(1)" title="Next month"><i class="ti ti-chevron-right"></i></button>

        <div class="pie-chart" style="background:conic-gradient(var(--success-ink) 0deg ${deg}deg, var(--danger) ${deg}deg 360deg)">
          <div class="pie-chart-hole">
            <div class="pie-chart-pct">${onTimePct}%</div>
            <div class="pie-chart-pct-lbl">on time</div>
          </div>
        </div>
        <div class="pie-legend">
          <div class="pie-legend-item"><span class="pie-dot" style="background:var(--success-ink)"></span> On time <b>${onTime}</b></div>

}

function renderTaskRow(t, compact){

// Horizontal timeline shown under each property. It covers the window that
// actually matters operationally: the post-closing period, from the closing
// date through the end of the last funding band. Each marker is a band
// boundary, labelled with the split that applies up to that day.
//
// Before closing there is nothing to plot — the bands are all measured from a
// date that hasn't happened yet — so the card says so instead.
function renderClosingTimeline(p){
  const bands = fundingBands(p);
  const since = daysSinceClosing(p);

  if(!p.closingDate){
    return `<div class="prop-timeline">
      <div class="prop-timeline-empty">
        <i class="ti ti-calendar-off" style="font-size:13px"></i>
        No closing date set${bands.length?` — ${bands.length} tier${bands.length===1?'':'s'} waiting on one`:''}
      </div>
      ${renderFundingTab(p, bands)}
    </div>`;
  }
  if(!bands.length){
    return `<div class="prop-timeline">
      <div class="prop-timeline-empty">
        <i class="ti ti-timeline-event" style="font-size:13px"></i>
        Closing ${fmtLong(p.closingDate)} · no funding tiers set
      </div>
      ${renderFundingTab(p, bands)}
    </div>`;
  }

  const lastDay = bands[bands.length-1].to;
  const pctOf   = day => Math.min(100, Math.max(0, (day / lastDay) * 100));
  // Before closing the window hasn't opened; past the last band it's spent.
  const elapsedPct = since == null || since < 0 ? 0 : pctOf(since);
  const current = activeBand(p);
  const expired = since != null && since > lastDay;

  const accent = expired ? 'var(--danger)' : current ? 'var(--accent)' : 'var(--ink-3)';

  // Band boundaries, labelled above/below alternately so neighbouring labels
  // can't overprint each other on a tight schedule.
  const html = bands.map((b, i) => {
    const pct    = pctOf(b.to);
    const side   = i % 2 === 0 ? 'above' : 'below';
    const past   = since != null && since > b.to;
    // Match on the band's end day, not its id: a tier saved without an id gets
    // a fresh one on every normalize pass, so ids can't be compared across two
    // separate calls. End days are unique after de-duplication.
    const isNow  = current && current.to === b.to;
    const align  = pct >= 94 ? 'translateX(-100%)' : 'translateX(-50%)';
    const split  = (b.pctUs!=null||b.pctFunder!=null)
      ? `${b.pctUs!=null?b.pctUs:'—'}% / ${b.pctFunder!=null?b.pctFunder:'—'}%` : '';
    const tip = `${b.label}${b.date?` — through ${fmtLong(b.date)}`:''}`
      + (split?` · us ${b.pctUs}% / funder ${b.pctFunder}%`:'')
      + (isNow?' · current band':'');
    return `<div class="tl-mark" style="left:${pct}%" title="${escape(tip)}">
      <div class="tl-dot ${past?'':'is-future'}"
           style="background:${past?'var(--accent)':'var(--surface)'};border-color:var(--surface)"></div>
      <div class="tl-stem ${side}"></div>
      <div class="tl-label ${side}" style="transform:${align}">
        <span class="tl-name" style="${isNow?'color:var(--accent)':''}">${escape(b.label)}</span>
        <span class="tl-meta">${split}</span>
      </div>
    </div>`;
  }).join('');

  // Day 0 is the closing itself — anchor the left edge so the bands read as
  // time since closing rather than floating free.
  const zero = `<div class="tl-mark" style="left:0%" title="Closing ${escape(fmtLong(p.closingDate))}">
    <div class="tl-dot" style="background:var(--accent);border-color:var(--surface)"></div>
    <div class="tl-stem below"></div>
    <div class="tl-label below" style="transform:translateX(0)">
      <span class="tl-name">Closing</span>
      <span class="tl-meta">${fmt(p.closingDate)}</span>
    </div>
  </div>`;

  const statusLabel = since == null ? ''
    : since < 0  ? `Closes in ${Math.abs(since)} day${Math.abs(since)===1?'':'s'}`
    : expired    ? `Day ${since} — past the ${lastDay}-day window`
    : `Day ${since} of ${lastDay}`;

  const bandBit = current
    ? `<span class="tl-sep">·</span> <span style="color:var(--ink-3)">in ${current.label}
         · us ${current.pctUs!=null?current.pctUs+'%':'—'} / funder ${current.pctFunder!=null?current.pctFunder+'%':'—'}
         ${(()=>{const v=shareOf(p,current.pctUs);return v!=null?`· ${money(v)} to us`:'';})()}</span>`
    : since != null && since < 0
      ? `<span class="tl-sep">·</span> <span style="color:var(--ink-3)">${bands.length} tier${bands.length===1?'':'s'} ready</span>`
      : '';

  return `<div class="prop-timeline">
    <div class="prop-timeline-plot">
      <div class="prop-timeline-track">
        <div class="prop-timeline-fill" style="width:${elapsedPct}%"></div>
        ${zero}
        ${html}
      </div>
    </div>
    <div class="prop-timeline-status" style="color:${accent}">
      <i class="ti ti-flag-3" style="font-size:11px"></i> ${statusLabel} ${bandBit}
    </div>
    ${renderFundingTab(p, bands)}
  </div>`;
}

/* The tab under the timeline: click it to edit this property's funding tiers
   in place, without opening the whole property form. Open/closed lives in
   state.fundingOpen so a re-render (a save elsewhere, a background refresh)
   doesn't snap the panel shut mid-edit.

   The card stays quiet until you ask: closed, it's just the tab. The editor
   and the band breakdown both live behind it, so a list of properties reads
   as timelines rather than a wall of numbers.

   Rows are appended to the DOM directly rather than re-rendering, so nothing
   you've typed is lost while the panel is open. */
function renderFundingTab(p, bands){
  bands = bands || fundingBands(p);
  const open = state.fundingOpen === p.id;

  const tab = `<button class="funding-tab ${open?'is-open':''}" data-action="toggle-funding" data-id="${p.id}">
    <i class="ti ti-${open?'chevron-down':'chevron-right'}"></i>
    ${bands.length ? `Edit funding tiers <span class="funding-tab-count">${bands.length}</span>`
                   : 'Add funding tiers'}
  </button>`;

  if(!open) return `<div class="funding-tabs">${tab}</div>`;

  return `<div class="funding-tabs">${tab}</div>
    <div class="funding-panel">
      <p class="form-hint" style="margin-top:0">
        One row per band. Enter the day the band ends — counted from the closing
        date — and how the profit splits while the deal sits in it. Start days,
        dates and totals are worked out for you.
      </p>
      <div class="funding-panel-head">
        <span>Band</span><span>Ends day</span><span>% to us</span><span>% to funder</span><span></span>
      </div>
      <div id="fund-rows-${p.id}"></div>
      <div class="funding-foot">
        <button type="button" class="btn btn-sm" onclick="addFundingRow(null,'${p.id}')">
          <i class="ti ti-plus"></i> Add tier
        </button>
        <span id="fund-total-${p.id}" class="funding-total"></span>
        <span class="funding-panel-actions">
          <button type="button" class="btn btn-sm" onclick="closeFundingPanel()">Cancel</button>
          <button type="button" class="btn btn-sm btn-primary" onclick="saveFundingTiers('${p.id}')">Save tiers</button>
        </span>
      </div>
      ${renderFundingTable(p, bands)}
    </div>`;
}

function toggleFundingPanel(id){
  state.fundingOpen = state.fundingOpen === id ? null : id;
  app.render();
}
function closeFundingPanel(){
  state.fundingOpen = null;
  app.render();
}
// Called after render() so the rows land in a container that exists. An empty
// schedule opens with one blank row — the point of the tab is to add tiers, so
// making you click "Add tier" first would be a wasted step.
function hydrateFundingPanel(){
  const id = state.fundingOpen;
  if(!id || !document.getElementById(`fund-rows-${id}`)) return;
  const p = state.props.find(x=>x.id===id);
  if(!p) return;
  const tiers = normalizeFunding(p.funding, p);
  if(tiers.length) tiers.forEach(t => addFundingRow(t, id));
  else addFundingRow(null, id);
  updateFundingTotal(id);
}
async function saveFundingTiers(id){
  const p = state.props.find(x=>x.id===id);
  if(!p) return;
  const tiers = readFundingRows(id);
  // Rows with no end day (or a duplicate one) can't form a band and are
  // dropped by normalizeFunding — say so rather than letting them vanish.
  const typed = document.getElementById(`fund-rows-${id}`).querySelectorAll('.funding-row').length;
  p.funding = tiers;
  await saveOne('props', p);
  state.fundingOpen = null;
  toast(typed > tiers.length
    ? `Saved ${tiers.length} tier${tiers.length===1?'':'s'} · ${typed-tiers.length} skipped (needs an end day)`
    : `Funding tiers saved`);
  app.render();
}

// The band-by-band breakdown, shown inside the open panel. The timeline
// answers "when"; this answers "what's the split, and what is it worth".
function renderFundingTable(p, bands){
  bands = bands || fundingBands(p);
  if(!bands.length) return '';
  const since   = daysSinceClosing(p);
  const current = activeBand(p);

  const rows = bands.map(b => {
    const past = since != null && since > b.to;
    const now  = current && current.to === b.to;   // see note in renderClosingTimeline
    const ours = shareOf(p, b.pctUs);
    return `<tr class="${past||now?'is-funded':''}">
      <td class="ft-name">${escape(b.label)}</td>
      <td>${b.date?fmt(b.date):'<span class="ft-dim">needs closing date</span>'}</td>
      <td class="ft-num">${b.pctUs!=null?`${b.pctUs}%`:'—'}</td>
      <td class="ft-num">${b.pctFunder!=null?`${b.pctFunder}%`:'—'}</td>
      <td class="ft-num">${ours!=null?money(ours):(b.pctUs!=null?'<span class="ft-dim">needs sell price</span>':'—')}</td>
      <td class="ft-status">${now
        ? `<span class="ft-pill ft-done"><i class="ti ti-player-play"></i> Current</span>`
        : past ? `<span class="ft-pill"><i class="ti ti-check"></i> Passed</span>`
               : `<span class="ft-pill"><i class="ti ti-clock"></i> Upcoming</span>`}</td>
    </tr>`;
  }).join('');

  const last = bands[bands.length-1];
  return `<table class="funding-table">
    <thead>
      <tr>
        <th>Band</th><th>Through</th><th class="ft-num">% to us</th>
        <th class="ft-num">% to funder</th><th class="ft-num">Our share</th><th></th>
      </tr>
    </thead>
    <tbody>${rows}</tbody>
    <tfoot>
      <tr>
        <td colspan="2">${bands.length} tier${bands.length===1?'':'s'} · ${last.to}-day window</td>
        <td class="ft-num"></td><td class="ft-num"></td><td class="ft-num"></td>
        <td class="ft-status"></td>
      </tr>
    </tfoot>
  </table>`;
}

/* Properties can be ordered by the dates that actually drive the work.
   Each sorter returns a date string, or '' for a deal the sort can't place —
   those always sink to the bottom rather than jumping to the top on an empty
   string comparison. */
const PROP_SORTS = {
  closing: {
    label: 'Closing date',
    hint:  'Soonest closing first',
    key:   p => p.closingDate || ''
  },
  finalTier: {
    label: 'Funding final tier',
    hint:  'By the day the last band closes out',
    key:   p => (finalTier(p) || {}).date || ''
  },
  nextTier: {
    label: 'Next funding tier step',
    hint:  'By the next band boundary ahead',
    key:   p => (nextTier(p) || {}).date || ''
  }
};

function renderProperties(){
  const q = (state.filters.propSearch||'').toLowerCase();
  const sortKey = state.filters.propSort || 'closing';
  const sorter  = PROP_SORTS[sortKey] || PROP_SORTS.closing;

  const filtered = state.props.filter(p=>{
    if(q && !JSON.stringify(p).toLowerCase().includes(q)) return false;
    return true;
  }).sort((a,b)=>{
    const ka = sorter.key(a), kb = sorter.key(b);
    if(!ka && !kb) return (b.created||'').localeCompare(a.created||'');
    if(!ka) return 1;          // undated deals sink, whichever sort is active
    if(!kb) return -1;
    return ka.localeCompare(kb);
  });

  const unplaced = filtered.filter(p=>!sorter.key(p)).length;

  return pageHeader('Deals', 'Properties', 'Every parcel, offer, and ARV.',
    `<button class="btn btn-primary" data-action="new-prop"><i class="ti ti-plus"></i> Add property</button>`) + `
    <div class="toolbar">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" placeholder="Search property ID, county, notes…" data-filter="propSearch" value="${escape(q)}">
      </div>
      <div class="sort-wrap">
        <label class="sort-label" for="prop-sort"><i class="ti ti-arrows-sort"></i> Organize by</label>
        <select class="form-select" id="prop-sort" data-filter="propSort" style="max-width:210px">
          ${Object.entries(PROP_SORTS).map(([k,s])=>
            `<option value="${k}" ${sortKey===k?'selected':''}>${s.label}</option>`).join('')}
        </select>
        <span class="sort-hint">${sorter.hint}${unplaced?` · ${unplaced} without one, listed last`:''}</span>
      </div>
    </div>
    <div class="item-list">
    ${filtered.map(p=>{
      const equity = equityOf(p);
      const equityPct = (equity!==null && parseFloat(p.buyPrice)) ? Math.round((equity/parseFloat(p.buyPrice))*100) : null;
      return `<div class="item-row" style="flex-wrap:wrap">
        <div style="width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-map-2" style="font-size:20px"></i></div>
        <div class="item-main">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;flex-wrap:wrap">
            <span class="item-title">${escape(p.propertyId || 'No property ID')}</span>
          </div>
          <div class="item-meta">
            <span>${escape(p.county)}, ${escape(p.state)}</span>
            <span>· ${p.acres} acres</span>
          </div>
          <div class="price-row">
            <div class="price-item"><span class="price-label">Buy</span><span class="price-value">${money(p.buyPrice)}</span></div>
            <div class="price-item"><span class="price-label">Sell</span><span class="price-value">${p.sellPrice?money(p.sellPrice):'—'}</span></div>
            ${equity!==null?`<span class="margin-pill" style="${equity<0?'background:var(--danger-soft);color:var(--danger)':''}">${equity>=0?'+':''}${money(equity)} equity${equityPct!==null?` (${equityPct>=0?'+':''}${equityPct}%)`:''}</span>`:''}
          </div>
        </div>
        <div class="item-actions">
          <button class="icon-btn" data-action="edit-prop" data-id="${p.id}" title="Edit">${ICON_EDIT}</button>
          <button class="icon-btn" data-action="delete-prop" data-id="${p.id}" title="Delete">${ICON_DELETE}</button>
        </div>
        <div style="flex-basis:100%">${renderClosingTimeline(p)}</div>
      </div>`;
    }).join('') || `<div class="empty"><i class="ti ti-home"></i><h3>No properties yet</h3><p>${q?'Try a different search.':'Track your first deal.'}</p><button class="btn btn-primary" data-action="new-prop"><i class="ti ti-plus"></i> Add property</button></div>`}
    </div>`;
}

/* =========================================================
   TASKS & PROJECTS — one tab, two boards. The segmented
   control swaps between the task list and the projects
   kanban; each keeps the toolbar and layout it always had.
   ========================================================= */
function renderTasksProjects(){
  const tab = getTpTab();
  const openTasks = state.tasks.filter(t=>t.status!=='done').length;
  const openProjs = state.projects.filter(p=>p.status!=='done').length;

  const action = isTasks
    ? `<button class="btn btn-primary" data-action="new-task"><i class="ti ti-plus"></i> Add task</button>`
    : `<button class="btn btn-primary" data-action="new-project"><i class="ti ti-plus"></i> New project</button>`;

  return pageHeader('Work', 'Tasks & Projects',
    isTasks ? 'What\'s in flight across the team.'
            : 'Drag cards between stages as work moves forward.',
    action) + `
    <div class="seg-control" role="tablist">
      <button class="seg-btn ${isTasks?'active':''}" role="tab" aria-selected="${isTasks}" onclick="setTpTab('tasks')">
        <i class="ti ti-checkbox"></i> Tasks <span class="seg-count">${openTasks}</span>
      </button>
      <button class="seg-btn ${!isTasks?'active':''}" role="tab" aria-selected="${!isTasks}" onclick="setTpTab('projects')">
        <i class="ti ti-bulb"></i> Projects <span class="seg-count">${openProjs}</span>
      </button>
    </div>
    ${isTasks ? renderTasksSection() : renderProjectsSection()}`;
}

function renderTasksSection(){
  const q = (state.filters.taskSearch||'').toLowerCase();
  const pri = state.filters.taskPri||'';
  const assign = state.filters.taskAssign||'';
  const mine = state.filters.taskMine||false;

  const filter = (list) => list.filter(t=>{
    if(pri && t.priority!==pri) return false;
    if(assign && !(t.assignees||[]).includes(assign)) return false;
    if(mine && state.activeUserId && !(t.assignees||[]).includes(state.activeUserId)) return false;
    if(q && !JSON.stringify(t).toLowerCase().includes(q)) return false;
    return true;
  });

  const open = filter(state.tasks.filter(t=>t.status!=='done'))
    .sort((a,b)=>(a.dueDate||'').localeCompare(b.dueDate||''));
  // Sort completed tasks by when they were completed (most recent first) so
  // the list holds a stable order instead of jumping around as tasks are
  // checked off in whatever order they happen to sit in the underlying array.
  const done = filter(state.tasks.filter(t=>t.status==='done'))
    .sort((a,b)=>(b.completedAt||'').localeCompare(a.completedAt||''));

  return `
    <div class="toolbar">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" placeholder="Search tasks…" data-filter="taskSearch" value="${escape(q)}">
      </div>
      <select class="filter-select" data-filter="taskPri">
        <option value="">All priorities</option>
        <option value="high" ${pri==='high'?'selected':''}>High</option>
        <option value="medium" ${pri==='medium'?'selected':''}>Medium</option>
        <option value="low" ${pri==='low'?'selected':''}>Low</option>
      </select>
      <select class="filter-select" data-filter="taskAssign">
        <option value="">All assignees</option>
        ${state.users.map(u=>`<option value="${u.id}" ${u.id===assign?'selected':''}>${escape(u.name)}</option>`).join('')}
      </select>
      ${state.activeUserId?`<label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);cursor:pointer;padding:0 8px"><input type="checkbox" ${mine?'checked':''} data-filter="taskMine" style="accent-color:var(--accent)"> My tasks only</label>`:''}
    </div>

    <div style="font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Open (${open.length})</div>
    <div class="item-list" style="margin-bottom:24px">
      ${open.map(t=>renderTaskRow(t,false)).join('') || `<div class="empty"><i class="ti ti-checks"></i><h3>Nothing on the docket</h3><p>All tasks complete for this filter.</p></div>`}
    </div>
    ${done.length?`
      <div style="font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Completed (${done.length})</div>
      <div class="item-list" style="opacity:.7">${done.slice(0,15).map(t=>renderTaskRow(t,false)).join('')}</div>
    `:''}`;
}

function renderProjectsSection(){
  const q = (state.filters.projSearch||'').toLowerCase();
  const cat = state.filters.projCat||'';
  const filtered = state.projects.filter(p=>{
    if(cat && p.category!==cat) return false;
    if(q && !JSON.stringify(p).toLowerCase().includes(q)) return false;
    return true;
  });

  return `
    <div class="toolbar">

/* =========================================================
   ACTIVITY LOG — daily call logging + campaign logging,
   surfaced on a month calendar. One call-log entry per day
   (aggregate team counts); any number of campaign entries
   per day (one per campaign touch).
   ========================================================= */
function getCallLog(dateStr){
  return state.callLogs.find(c => c.date === dateStr)
    || {id:null, date:dateStr, callsMade:0, conversationsHeld:0, offersMade:0, offersAccepted:0, notInterested:0, notes:''};
}
function campaignEntriesForDay(dateStr){
  return state.campaignLogs.filter(c => c.date === dateStr);
}
// The calendar's month offset is persisted in localStorage so navigating
// back to, say, six months ago and refreshing the page (or coming back
// tomorrow) doesn't silently snap you back to the current month.
function getActivityCalendarOffset(){
  if(state.activityCalendarOffset === undefined){
    state.activityCalendarOffset = parseInt(Prefs.get('activityCalOffset', 0), 10) || 0;
  }
  return state.activityCalendarOffset;
}
function activityMonthBase(){
  const base = new Date();
  base.setDate(1);
  base.setMonth(base.getMonth() + getActivityCalendarOffset());
  return base;
}
// Time range for the Activity Log stat totals — independent of which month
// the calendar below happens to be showing.
const ACTIVITY_RANGES = {
  today:  {label:'Today'},
  week:   {label:'This week'},
  month:  {label:'This month'},
  last7:  {label:'Last 7 days'},
  last30: {label:'Last 30 days'},
  all:    {label:'All time'},
  custom: {label:'Custom range'}
};
function isoDaysAgo(n){
  const d = new Date();
  d.setDate(d.getDate()-n);
  return d.toISOString().slice(0,10);
}
/* =========================================================
   ACTIVITY TRENDS CHART — pick any two metrics from calls,
   campaigns, and SMS logging and compare them over a chosen
   time period. Pure inline SVG, no charting library.
   ========================================================= */
const TREND_METRICS = {
  callsMade:         {label:'Calls made',       color:'#2E5D3A'},
  conversationsHeld: {label:'Calls picked up',  color:'#1F3C5C'},
  offersMade:        {label:'Offers made',      color:'#6B4A0E'},
  notInterested:     {label:'Rejected leads',   color:'#B8422E'},
  campaignsSent:     {label:'Campaigns sent',   color:'#38315C'},
  smsSent:           {label:'SMS sent',         color:'#72243E'}
};
const TREND_RANGES = {7:'Last 7 days', 30:'Last 30 days', 90:'Last 90 days', 180:'Last 6 months', 365:'Last 12 months'};

function getTrendDayValue(metricKey, dateStr){
  if(metricKey==='campaignsSent') return campaignEntriesForDay(dateStr).length;
  if(metricKey==='smsSent') return campaignEntriesForDay(dateStr).filter(c=>c.channel==='SMS').length;
  const log = state.callLogs.find(c=>c.date===dateStr);
  return log ? (Number(log[metricKey])||0) : 0;
}
// One point per day for the trailing `days` days, aggregated into
// weekly/monthly buckets for longer ranges so the chart stays readable.
function buildTrendSeries(metricKey, days){
  const points = [];
  for(let i=days-1;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const dateStr = d.toISOString().slice(0,10);
    points.push({date:dateStr, value:getTrendDayValue(metricKey,dateStr)});
  }
  if(days<=45) return points;
  const bucketSize = days<=120 ? 7 : 30;
  const buckets = [];
  for(let i=0;i<points.length;i+=bucketSize){
    const slice = points.slice(i,i+bucketSize);
    buckets.push({date:slice[slice.length-1].date, value:slice.reduce((s,p)=>s+p.value,0)});
  }
  return buckets;
}
function renderTrendChart(){
  const range = parseInt(state.filters.trendRange||'30',10);
  const metricA = state.filters.trendMetricA || 'callsMade';
  const metricB = state.filters.trendMetricB !== undefined ? state.filters.trendMetricB : 'offersMade';
  const seriesA = buildTrendSeries(metricA, range);
  const seriesB = metricB ? buildTrendSeries(metricB, range) : null;
  const allVals = [...seriesA.map(p=>p.value), ...(seriesB?seriesB.map(p=>p.value):[])];
  const maxVal = Math.max(1, ...allVals);
  const W = 640, H = 220, padL = 30, padR = 12, padT = 14, padB = 24;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const n = seriesA.length;
  const xFor = i => padL + (n<=1?0:(i/(n-1))*plotW);
  const yFor = v => padT + plotH - (v/maxVal)*plotH;
  const pathFor = series => series.map((p,i)=>`${i===0?'M':'L'}${xFor(i).toFixed(1)},${yFor(p.value).toFixed(1)}`).join(' ');
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const y = padT + plotH - f*plotH;
    return `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1"/><text x="${padL-6}" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--ink-3)" text-anchor="end">${Math.round(maxVal*f)}</text>`;
  }).join('');
  const labelCount = Math.min(6, n);
  const xLabels = [];
  for(let k=0;k<labelCount;k++){
    const idx = n<=1?0:Math.round(k*(n-1)/((labelCount-1)||1));
    const d = new Date(seriesA[idx].date+'T00:00:00');
    xLabels.push(`<text x="${xFor(idx).toFixed(1)}" y="${H-6}" font-size="9" fill="var(--ink-3)" text-anchor="middle">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</text>`);
  }
  const colorA = TREND_METRICS[metricA].color;
  const colorB = metricB ? TREND_METRICS[metricB].color : null;
  const totalA = seriesA.reduce((s,p)=>s+p.value,0);
  const totalB = seriesB ? seriesB.reduce((s,p)=>s+p.value,0) : null;

  return `<div class="card" style="margin-bottom:24px">
    <div class="card-header" style="flex-wrap:wrap;gap:10px">
      <div>
        <div class="card-title">Activity trends</div>
        <div class="card-sub">Pick up to two metrics to compare over time</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <select class="filter-select" data-filter="trendRange" style="min-width:130px">
          ${Object.entries(TREND_RANGES).map(([k,v])=>`<option value="${k}" ${String(range)===k?'selected':''}>${v}</option>`).join('')}
        </select>
        <select class="filter-select" data-filter="trendMetricA" style="min-width:150px">
          ${Object.entries(TREND_METRICS).map(([k,v])=>`<option value="${k}" ${metricA===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
        <select class="filter-select" data-filter="trendMetricB" style="min-width:150px">
          <option value="" ${metricB?'':'selected'}>Compare to…</option>
          ${Object.entries(TREND_METRICS).map(([k,v])=>`<option value="${k}" ${metricB===k?'selected':''}>${v.label}</option>`).join('')}
        </select>
      </div>
    </div>
    <div style="display:flex;gap:16px;margin-bottom:10px;font-size:12px;flex-wrap:wrap">
      <span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:${colorA};display:inline-block"></span>${TREND_METRICS[metricA].label} · ${totalA} total</span>
      ${metricB?`<span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:${colorB};display:inline-block;border:1px dashed ${colorB}"></span>${TREND_METRICS[metricB].label} · ${totalB} total</span>`:''}
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;overflow:visible">
      ${gridLines}
      <path d="${pathFor(seriesA)}" fill="none" stroke="${colorA}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round"/>
      ${seriesB?`<path d="${pathFor(seriesB)}" fill="none" stroke="${colorB}" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5,3"/>`:''}
      ${xLabels.join('')}
    </svg>
  </div>`;
}

function getActivityRange(){
  const range = state.filters.activityRange || 'month';
  const todayStr = today();
  let start, end;
  if(range === 'today'){ start = todayStr; end = todayStr; }
  else if(range === 'week'){
    const d = new Date(); d.setDate(d.getDate()-d.getDay());
    start = d.toISOString().slice(0,10); end = todayStr;
  }
  else if(range === 'last7'){ start = isoDaysAgo(6); end = todayStr; }
  else if(range === 'last30'){ start = isoDaysAgo(29); end = todayStr; }
  else if(range === 'month'){
    const d = new Date(); d.setDate(1);
    start = d.toISOString().slice(0,10);
    const e = new Date(d); e.setMonth(e.getMonth()+1); e.setDate(0);
    end = e.toISOString().slice(0,10);
  }
  else if(range === 'all'){ start = '0000-01-01'; end = '9999-12-31'; }
  else { // custom
    start = state.filters.activityRangeStart || todayStr;
    end = state.filters.activityRangeEnd || todayStr;
    if(start > end){ [start, end] = [end, start]; }
  }
  const label = range === 'custom' ? `${fmtLong(start)} – ${fmtLong(end)}` : ACTIVITY_RANGES[range].label;
  return {range, start, end, label};
}
/* =========================================================
   KPIs & TRACKING — one tab, two views. The segmented control
   swaps between the pipeline KPI sections and the daily

function renderActivityView(){

  const inRange = dateStr => !!dateStr && dateStr >= start && dateStr <= end;

  const rangeCampaigns = state.campaignLogs.filter(c=>inRange(c.date));
  const totals = rangeCallLogs.reduce((s,c)=>{
    s.calls += Number(c.callsMade)||0;
    s.conv += Number(c.conversationsHeld)||0;
    s.offersMade += Number(c.offersMade)||0;
    s.offersAccepted += Number(c.offersAccepted)||0;
    s.dropped += Number(c.notInterested)||0;
    return s;
  }, {calls:0, conv:0, offersMade:0, offersAccepted:0, dropped:0});
  const campLeads = rangeCampaigns.reduce((s,c)=>s+(parseInt(c.leadsGenerated)||0),0);
  const countySet = new Set();
  rangeCampaigns.forEach(c=>(c.countiesHit||'').split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>countySet.add(x)));

  return `
  <div class="toolbar" style="margin-bottom:16px">
    <select class="filter-select" data-filter="activityRange">
      ${Object.entries(ACTIVITY_RANGES).map(([k,v])=>`<option value="${k}" ${k===range?'selected':''}>${v.label}</option>`).join('')}
    </select>

    ` : ''}
  </div>
  <div style="font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Call stats</div>
  <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
    <div class="stat-card" style="flex:1;min-width:150px">
      <div class="stat-label"><i class="ti ti-phone" style="font-size:14px"></i> Calls made</div>
      <div class="stat-value">${totals.calls}</div>
      <div class="stat-delta">${label}</div>
    </div>
    <div class="stat-card" style="flex:1;min-width:150px">
      <div class="stat-label"><i class="ti ti-messages" style="font-size:14px"></i> Conversations held</div>
      <div class="stat-value">${totals.conv}</div>
      <div class="stat-delta">${label}</div>
    </div>
    <div class="stat-card" style="flex:1;min-width:150px">
      <div class="stat-label"><i class="ti ti-file-check" style="font-size:14px"></i> Offers accepted</div>
      <div class="stat-value">${totals.offersAccepted}</div>
      <div class="stat-delta">of ${totals.offersMade} made</div>
    </div>
    <div class="stat-card" style="flex:1;min-width:150px">
      <div class="stat-label"><i class="ti ti-mood-sad" style="font-size:14px"></i> Not interested / dropped</div>
      <div class="stat-value">${totals.dropped}</div>
      <div class="stat-delta">${label}</div>
    </div>
  </div>

  <div style="font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">Campaign stats</div>
  <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
    <div class="stat-card" style="flex:1;min-width:150px">
      <div class="stat-label"><i class="ti ti-map-pin" style="font-size:14px"></i> Counties hit</div>
      <div class="stat-value">${countySet.size}</div>
      <div class="stat-delta">${rangeCampaigns.length} campaign entries</div>
    </div>
    <div class="stat-card" style="flex:1;min-width:150px">
      <div class="stat-label"><i class="ti ti-speakerphone" style="font-size:14px"></i> Campaign leads</div>
      <div class="stat-value">${campLeads}</div>
      <div class="stat-delta">${label}</div>
    </div>
  </div>
  ${renderTrendChart()}
  ${renderActivityCalendar()}`;
}

function renderActivityCalendar(){
  const base = activityMonthBase();
  const year = base.getFullYear(), month = base.getMonth();
  const startWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = base.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  const todayStr = today();

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const callLog = state.callLogs.find(c=>c.date===dateStr);
    const campCount = campaignEntriesForDay(dateStr).length;
    const isToday = dateStr === todayStr;
    // Flag any day that's already happened but has zero (or no) calls, and
    // separately any day with no campaign entry at all — future days are
    // left alone since there's nothing to log yet.
    const isPast = dateStr <= todayStr;
    const hasCalls = callLog && Number(callLog.callsMade) > 0;
    const hasCampaign = campCount > 0;
    const noCalls = isPast && !hasCalls;
    const noCampaign = isPast && !hasCampaign;
    cells += `<div class="cal-cell ${isToday?'cal-today':''}" onclick="openActivityDayModal('${dateStr}')" title="Log activity for this day">
      <div class="cal-daynum">${d}</div>
      ${hasCalls ? `<div class="cal-task" style="border-left-color:var(--info-ink);background:var(--info-soft);color:var(--info-ink)" title="${callLog.callsMade} calls · ${callLog.conversationsHeld} conversations"><i class="ti ti-phone" style="font-size:10px"></i> ${callLog.callsMade} calls</div>` : ''}
      ${noCalls ? `<div class="cal-task" style="border-left-color:var(--danger);background:var(--danger-soft);color:var(--danger);font-weight:600"><i class="ti ti-phone-off" style="font-size:10px"></i> No calls</div>` : ''}
      ${hasCampaign ? `<div class="cal-task" style="border-left-color:var(--purple-ink);background:var(--purple-soft);color:var(--purple-ink)"><i class="ti ti-speakerphone" style="font-size:10px"></i> ${campCount} campaign${campCount>1?'s':''}</div>` : ''}
      ${noCampaign ? `<div class="cal-task" style="border-left-color:var(--danger);background:var(--danger-soft);color:var(--danger);font-weight:600"><i class="ti ti-alert-triangle" style="font-size:10px"></i> No campaign</div>` : ''}
    </div>`;
  }

  // Quick-jump dropdowns let you land on any month years back without
  // clicking "previous" dozens of times — selecting either one jumps
  // straight there and the choice is remembered (see getActivityCalendarOffset).
  const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const nowY = new Date().getFullYear();
  const yearOptions = [];
  for(let y = nowY - 10; y <= nowY + 1; y++) yearOptions.push(y);

  return `<div class="card" style="margin-bottom:24px">
    <div class="card-header" style="flex-wrap:wrap;gap:10px">
      <div>
        <div class="card-title">Calendar</div>
        <div class="card-sub">${monthLabel} · click any day to log calls or campaigns</div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <select class="filter-select" id="cal-jump-month" style="min-width:120px" onchange="calJumpChanged()">
          ${MONTH_NAMES.map((m,i)=>`<option value="${i}" ${i===month?'selected':''}>${m}</option>`).join('')}
        </select>
        <select class="filter-select" id="cal-jump-year" style="min-width:90px" onchange="calJumpChanged()">
          ${yearOptions.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}
        </select>
        <button class="icon-btn" onclick="shiftActivityCalendar(-1)" title="Previous month"><i class="ti ti-chevron-left"></i></button>
        <button class="icon-btn" onclick="shiftActivityCalendar(0)" title="Jump to today"><i class="ti ti-calendar-event"></i></button>
        <button class="icon-btn" onclick="shiftActivityCalendar(1)" title="Next month"><i class="ti ti-chevron-right"></i></button>
      </div>
    </div>
    <div class="cal-weekdays"><div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div></div>
    <div class="cal-grid">${cells}</div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;color:var(--danger)">
      <span style="width:9px;height:9px;border-radius:2px;background:var(--danger-soft);border:1px solid var(--danger);display:inline-block"></span>
      Red tag = no calls logged, or no campaign logged, for that day (shown separately)
    </div>
  </div>`;
}
function setActivityCalendarOffset(offset){
  state.activityCalendarOffset = offset;
  Prefs.set('activityCalOffset', offset);
  app.render();
}
function shiftActivityCalendar(delta){
  setActivityCalendarOffset(delta===0 ? 0 : getActivityCalendarOffset()+delta);
}
// Jump straight to whatever month/year is selected in the calendar's
// quick-jump dropdowns — works for any month in the past (or future).
function calJumpChanged(){
  const monthSel = document.getElementById('cal-jump-month');
  const yearSel = document.getElementById('cal-jump-year');
  if(!monthSel || !yearSel) return;
  const targetMonth = parseInt(monthSel.value, 10);
  const targetYear = parseInt(yearSel.value, 10);
  const now = new Date(); now.setDate(1);
  const offset = (targetYear - now.getFullYear()) * 12 + (targetMonth - now.getMonth());
  setActivityCalendarOffset(offset);
}

  showModal(`<div class="modal" style="max-width:560px">
    <div class="modal-header">

        <div class="page-eyebrow" style="margin-bottom:2px">Activity Log</div>
        <h2 class="modal-title">${label}</h2>

      <button class="icon-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>

async function saveCallLogForDay(dateStr){
  const existing = state.callLogs.find(c=>c.date===dateStr);
  const data = {
    id: existing ? existing.id : uid(),
    date: dateStr,
    callsMade: Number($('#al-calls').value)||0,
    conversationsHeld: Number($('#al-conv').value)||0,
    offersMade: Number($('#al-offersmade').value)||0,
    offersAccepted: Number($('#al-offersaccepted').value)||0,
    notInterested: Number($('#al-dropped').value)||0,
    notes: $('#al-notes').value.trim()
  };
  if(existing){ const i = state.callLogs.findIndex(c=>c.id===existing.id); state.callLogs[i] = data; }
  else state.callLogs.push(data);
  await saveOne('callLogs', data);
  toast('Call log saved');
  app.render();
  openActivityDayModal(dateStr);
}

async function saveCampaignEntry(dateStr, id){
  const name = $('#ace-name').value.trim();
  if(!name){ toast('Campaign name is required','err'); return; }
  const existing = id ? state.campaignLogs.find(c=>c.id===id) : null;
  const data = {
    id: existing ? existing.id : uid(),
    date: dateStr,
    campaignName: name,
    channel: $('#ace-channel').value,
    countiesHit: $('#ace-counties').value.trim(),
    leadsGenerated: $('#ace-leads').value,
    notes: $('#ace-notes').value.trim()
  };
  if(existing){ const i = state.campaignLogs.findIndex(c=>c.id===existing.id); state.campaignLogs[i] = data; }
  else state.campaignLogs.push(data);
  await saveOne('campaignLogs', data);
  closeSubModal();
  toast('Campaign entry saved');
  app.render();
  openActivityDayModal(dateStr);
}

async function deleteCampaignEntry(id, dateStr){
  if(!confirm('Delete this campaign entry?')) return;
  state.campaignLogs = state.campaignLogs.filter(c=>c.id!==id);
  await deleteOne('campaignLogs', id);
  toast('Campaign entry deleted');
  app.render();
  openActivityDayModal(dateStr);
}

/* =========================================================
   EVENT BINDING
   ========================================================= */
/* Called after every render, and after a patch that created nodes. Elements
   are stamped once bound so a second pass over surviving nodes can't stack a
   duplicate listener on them — a doubled [data-action] listener would fire
   the same delete or save twice. */
function bindViewEvents(){
  const fresh = (el, tag) => {
    const k = 'bound' + tag;
    if(el.dataset[k]) return false;
    el.dataset[k] = '1';
    return true;
  };
  // Filters
  document.querySelectorAll('[data-filter]').forEach(el=>{
    if(!fresh(el, 'Filter')) return;
    const key = el.dataset.filter;
    if(el.type === 'checkbox'){
      el.addEventListener('change', ()=>{state.filters[key] = el.checked; app.render();});
    }else{
      el.addEventListener('input', debounce(()=>{state.filters[key] = el.value; app.render();}, el.tagName==='SELECT'?0:180));
    }
  });

  // Actions
  document.querySelectorAll('[data-action]').forEach(el=>{
    if(!fresh(el, 'Action')) return;
    // A row can carry data-action="open-task" while containing a checkbox and
    // buttons that carry their own. Without this the click bubbles and fires
    // both — ticking a task off would also pop its editor open.
    if(el.dataset.action === 'open-task'){
      el.addEventListener('click', ev => {
        if(ev.target.closest('input,button,select,a,label')) return;
        openTaskForm(el.dataset.id);
      });
      return;
    }
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const a = el.dataset.action, id = el.dataset.id;
      switch(a){
        case 'new-prop': openPropForm(); break;
        case 'edit-prop': openPropForm(id); break;
        case 'delete-prop': confirmDelete('prop',id); break;
        case 'new-task': openTaskForm(); break;
        // ADDED 2026-08-18: the whole row opens the task. Clicks that landed
        // on the checkbox or one of the action buttons are handled by their
        // own data-action and must not also open the editor, so those bail
        // out below before this runs.
        case 'open-task': openTaskForm(id); break;
        case 'edit-task': openTaskForm(id); break;
        case 'delete-task': confirmDelete('task',id); break;
        case 'toggle-task': toggleTask(id, el.checked); break;
        case 'new-project': openProjectForm(); break;
        case 'edit-project': openProjectForm(id); break;
        case 'delete-project': confirmDelete('project',id); break;
        case 'new-user': openUserForm(); break;
        case 'edit-user': openUserForm(id); break;
        case 'delete-user': confirmDelete('user',id); break;
        case 'export-data': exportData(); break;
        case 'import-data': importData(); break;
        case 'reset-data': resetData(); break;
        case 'toggle-funding': toggleFundingPanel(id); break;
      }
    });
  });
}

let debounceT;
function debounce(fn, ms){
  return (...args)=>{
    clearTimeout(debounceT);
    debounceT = setTimeout(()=>fn(...args), ms);
  };
}

function getLinkedName(id, type){
  if(type==='property'){ const p=state.props.find(x=>x.id===id); return p?'↳ '+(p.propertyId||'Property'):''; }
  return '';
}

async function toggleTask(id, checked){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = checked ? 'done' : 'todo';
  t.completedAt = checked ? today() : '';
  await saveOne('tasks', t);
  app.render();
  // If THIS device just marked it done, don't also notify "task completed" — that's redundant.
  if(checked) markSeen('notif_task_done_seen', id);
}

  toast(`${list.length} task${list.length>1?'s':''} moved to today`);

function dragStartCard(e, id){
  e.dataTransfer.setData('text/plain', id);
  e.dataTransfer.effectAllowed = 'move';
  e.currentTarget.classList.add('dragging');
}
function dragEndCard(e){
  e.currentTarget.classList.remove('dragging');
}
function dragOverCol(e){
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
}
function dragLeaveCol(e){
  e.currentTarget.classList.remove('drag-over');
}
async function dropProject(e, status){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const id = e.dataTransfer.getData('text/plain');
  const p = state.projects.find(x=>x.id===id);
  if(!p || p.status===status) return;
  p.status = status;
  await saveOne('projects', p);
  toast(`${p.title} → ${status.replace('-',' ')}`);
  app.render();
}

function toggleTaskInDay(id, dateStr){
  const t = state.tasks.find(x=>x.id===id);
  if(!t) return;
  const nowDone = t.status!=='done';
  t.status = nowDone ? 'done' : 'todo';
  t.completedAt = nowDone ? today() : '';
  saveOne('tasks', t).then(()=>{
    app.render();
    openDayModal(dateStr);
  });
}

async function confirmDelete(kind, id){
  const labels = {prop:'property', task:'task', project:'project', user:'team member'};
  const map = {prop:'props', task:'tasks', project:'projects', user:'users'};
  let msg = `Delete this ${labels[kind]}? This cannot be undone.`;
  if(kind==='user'){
    const openTasks = state.tasks.filter(t=>t.status!=='done'&&(t.assignees||[]).includes(id)).length;
    if(openTasks){
      msg = `This person has ${openTasks} open task(s) assigned. `
          + `They'll be unassigned (not deleted) when you remove this team member. Continue?`;
    }
  }
  if(!confirm(msg)) return;
  state[map[kind]] = state[map[kind]].filter(x=>x.id!==id);
  if(kind==='user' && state.activeUserId===id){
    state.activeUserId='';
    await StorageAdapter.saveActiveUser('');
  }
  await deleteOne(map[kind], id);
  toast(`${labels[kind].charAt(0).toUpperCase()+labels[kind].slice(1)} deleted`);
  app.render();
}

function showModal(html){
  document.body.style.overflow = 'hidden';
  $('#modal-root').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()">${html}</div>`;
  // focus first input
  requestAnimationFrame(()=>{
    const first = $('#modal-root').querySelector('input,select,textarea');
    if(first) first.focus();
  });
}
function closeModal(){
  document.body.style.overflow = '';
  $('#modal-root').innerHTML = '';
}
// Sub-modal: stacks on top of an already-open modal (e.g. quick-add a
// property from inside the task form) without touching/losing it underneath.
function showSubModal(html){
  $('#submodal-root').innerHTML = `<div class="modal-bg" style="z-index:150" onclick="if(event.target===this)closeSubModal()">${html}</div>`;
  requestAnimationFrame(()=>{
    const first = $('#submodal-root').querySelector('input,select,textarea');
    if(first) first.focus();
  });
}
function closeSubModal(){
  $('#submodal-root').innerHTML = '';
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){
    if($('#submodal-root').innerHTML) closeSubModal();
    else closeModal();
  }
});

      return `<span class="chip ${sel?'selected':''}" style="${style}" data-uid="${u.id}" onclick="toggleChip(this,'${fieldId}')">

  const uid = el.dataset.uid;
  const c = userColor(uid);
  const u = state.users.find(x=>x.id===uid);

/* ---- Funding tier editor ----
   Three inputs per row and nothing else: the day the band ends, our share,
   the funder's share. Band start days, calendar dates and labels are all
   derived, so there is nothing here to keep in sync by hand.

   Rows are plain DOM read back positionally on save, so they can be added and
   removed in any order without re-rendering and losing what's been typed.

   The same editor runs in two places: inside the property form modal
   (scope 'form') and inline on a property card (scope = the property id).
   fundingCtx resolves which elements to talk to and where the deal's figures
   come from — live inputs in the modal, the saved record on a card. */
function fundingCtx(scope){
  if(!scope || scope === 'form'){
    return {
      rows:'fp-funding-rows', total:'fp-funding-total',
      buy:  ()=>parseFloat((document.getElementById('fp-buy') ||{}).value),
      sell: ()=>parseFloat((document.getElementById('fp-sell')||{}).value),
      closing: ()=>(document.getElementById('fp-closing')||{}).value || ''
    };
  }
  const p = state.props.find(x=>x.id===scope) || {};
  return {
    rows:`fund-rows-${scope}`, total:`fund-total-${scope}`,
    buy:  ()=>parseFloat(p.buyPrice),
    sell: ()=>(p.sellPrice===''||p.sellPrice==null) ? NaN : parseFloat(p.sellPrice),
    closing: ()=>p.closingDate || ''
  };
}
function addFundingRow(entry, scope){
  const wrap = document.getElementById(fundingCtx(scope).rows);
  if(!wrap) return;
  const e = entry && typeof entry === 'object' ? entry : {};
  const s = (!scope || scope === 'form') ? 'form' : scope;
  const row = document.createElement('div');
  row.className = 'funding-row';
  row.innerHTML = `
    <span class="funding-band"></span>
    <input class="form-input funding-days" type="number" step="1" min="1" placeholder="e.g. 45"
           value="${e.days!=null?escape(e.days):''}" oninput="updateFundingTotal('${s}')">
    <input class="form-input funding-us" type="number" step="0.1" min="0" max="100" placeholder="75"
           value="${e.pctUs!=null?escape(e.pctUs):''}" oninput="syncSplit(this,'${s}')">
    <input class="form-input funding-funder" type="number" step="0.1" min="0" max="100" placeholder="25"
           value="${e.pctFunder!=null?escape(e.pctFunder):''}" oninput="syncSplit(this,'${s}')">
    <button type="button" class="icon-btn" title="Remove tier"
            onclick="this.parentNode.remove();updateFundingTotal('${s}')"><i class="ti ti-x"></i></button>`;
  wrap.appendChild(row);
  updateFundingTotal(scope);
  if(s !== 'form') row.querySelector('.funding-days').focus();
}
// The two shares are two halves of one number. Filling either one fills the
// other, so a 75/25 split is one keystroke rather than two — but typing
// directly into the other field still overrides it.
function syncSplit(input, scope){
  const row = input.parentNode;
  const us  = row.querySelector('.funding-us');
  const fu  = row.querySelector('.funding-funder');
  const other = input === us ? fu : us;
  const v = parseFloat(input.value);
  if(input.value !== '' && !isNaN(v) && v >= 0 && v <= 100){
    if(other.value === '' || other.dataset.auto === '1'){
      other.value = Math.round((100 - v) * 100) / 100;
      other.dataset.auto = '1';
    }
  }
  input.dataset.auto = '';
  updateFundingTotal(scope);
}
function readFundingRows(scope){
  const wrap = document.getElementById(fundingCtx(scope).rows);
  if(!wrap) return [];
  const p = {closingDate: fundingCtx(scope).closing()};
  return normalizeFunding([...wrap.querySelectorAll('.funding-row')].map(r=>({
    days:      r.querySelector('.funding-days').value,
    pctUs:     r.querySelector('.funding-us').value,
    pctFunder: r.querySelector('.funding-funder').value
  })), p);
}
// Live read-out under the rows: the bands as they currently stand, the total
// window, and anything that doesn't add up.
function updateFundingTotal(scope){
  const ctx = fundingCtx(scope);
  const el  = document.getElementById(ctx.total);
  const wrap = document.getElementById(ctx.rows);
  const rows = wrap ? [...wrap.querySelectorAll('.funding-row')] : [];

  // Relabel each row's band from the rows above it, so the ranges update as
  // you type rather than only after a save.
  let from = 0;
  const problems = [];
  rows.forEach((r, i) => {
    const days = parseFloat(r.querySelector('.funding-days').value);
    const tag  = r.querySelector('.funding-band');
    if(isNaN(days)){ tag.textContent = '—'; tag.className='funding-band is-dim'; return; }
    if(days < from){
      tag.textContent = `${from}-${days}`;
      tag.className = 'funding-band is-bad';
      problems.push(`row ${i+1} ends before it starts`);
    }else{
      tag.textContent = `${from}-${days} days`;
      tag.className = 'funding-band';
      from = days + 1;
    }
    const us = parseFloat(r.querySelector('.funding-us').value);
    const fu = parseFloat(r.querySelector('.funding-funder').value);
    if(!isNaN(us) && !isNaN(fu) && Math.abs(us + fu - 100) > 0.01){
      problems.push(`row ${i+1} splits ${Math.round((us+fu)*100)/100}%`);
    }
  });

  if(!el) return;
  if(!rows.length){ el.textContent = ''; return; }
  const days = rows.map(r=>parseFloat(r.querySelector('.funding-days').value)).filter(v=>!isNaN(v));
  const last = days.length ? Math.max(...days) : null;
  const closing = ctx.closing();
  const parts = [];
  if(last != null){
    parts.push(`Window: <strong>${last} days</strong>` +
      (closing ? ` <span style="color:var(--ink-3)">· through ${fmt(addDays(closing, last))}</span>`
               : ` <span style="color:var(--ink-3)">· needs a closing date</span>`));
  }
  if(problems.length) parts.push(`<span style="color:var(--danger)">${escape(problems.join(' · '))}</span>`);
  el.innerHTML = parts.join(' &nbsp;·&nbsp; ');
}
function updateEquityPreview(){
  updateFundingTotal('form'); // the closing date feeds the band date read-out
  const el = document.getElementById('fp-equity-preview');
  if(!el) return;
  const sellRaw = document.getElementById('fp-sell').value;
  if(sellRaw===''){ el.textContent = ''; return; }
  const buy = parseFloat(document.getElementById('fp-buy').value)||0;
  const sell = parseFloat(sellRaw)||0;
  const equity = sell - buy;
  el.style.color = equity<0 ? 'var(--danger)' : 'var(--accent)';
  el.textContent = `Equity created: ${equity>=0?'+':''}${money(equity)}`;
}
